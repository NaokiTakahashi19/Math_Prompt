<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>問題生成</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d8dde5;
      --text: #17202a;
      --muted: #5c6673;
      --accent: #1967d2;
      --accent-strong: #174ea6;
      --danger: #b3261e;
      --ok: #137333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.25;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .title-row h1 {
      margin-bottom: 0;
    }

    .app-updated {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      padding: 2px 8px;
      white-space: nowrap;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px 40px;
    }

    .toolbar,
    .output-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-weight: 700;
    }

    input,
    select,
    button,
    textarea {
      font: inherit;
    }

    select,
    input[type="password"] {
      min-height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
    }

    input[type="password"] {
      width: min(300px, 100%);
    }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f1f3f6;
      color: var(--muted);
      font-size: 13px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td.index-cell {
      width: 70px;
      font-weight: 700;
      white-space: nowrap;
    }

    td.status-cell {
      width: 160px;
      color: var(--muted);
    }

    .condition-select {
      width: 100%;
    }

    #status {
      min-height: 22px;
      color: var(--muted);
      margin: 8px 0 0;
    }

    #status.error {
      color: var(--danger);
    }

    #status.ok {
      color: var(--ok);
    }

    progress {
      width: min(460px, 100%);
      height: 12px;
      margin-right: 8px;
      vertical-align: middle;
    }

    #results-panel {
      display: none;
    }

    #results-panel.active {
      display: block;
    }

    .result-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 12px;
      background: #fff;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8f9fb;
    }

    .result-title {
      font-weight: 700;
      line-height: 1.45;
    }

    .result-title small {
      display: block;
      color: var(--muted);
      font-weight: 400;
    }

    .result-body {
      width: 100%;
      min-height: 260px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 6px;
      resize: vertical;
      padding: 14px;
      margin-top: 10px;
      line-height: 1.7;
      font-family: "Courier New", "Yu Gothic", monospace;
      white-space: pre-wrap;
    }

    .result-preview {
      padding: 18px;
      line-height: 1.8;
      overflow-x: auto;
    }

    .result-preview h1,
    .result-preview h2,
    .result-preview h3 {
      line-height: 1.35;
    }

    .result-preview table {
      border-collapse: collapse;
      margin: 0.75em 0 1em;
      max-width: 100%;
      min-width: auto;
      width: fit-content;
      display: block;
      overflow-x: auto;
    }

    .result-preview th,
    .result-preview td {
      border: 1px solid #999;
      padding: 4px 10px;
      text-align: right;
      white-space: nowrap;
    }

    .result-preview .segment > svg {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    mjx-container[jax="SVG"][display="true"] {
      display: block;
      text-align: center;
      margin: 1em 0;
    }

    mjx-container[jax="SVG"]:not([display="true"]) {
      display: inline-block;
      vertical-align: -0.2em;
      margin: 0 .1em;
    }

    details.raw-editor {
      border-top: 1px solid var(--line);
      padding: 10px 12px 14px;
    }

    details.raw-editor summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
    }

    .empty {
      color: var(--muted);
      padding: 18px 0 4px;
    }

    @media (max-width: 720px) {
      header {
        padding: 12px 16px;
        display: block;
      }

      main {
        padding: 14px 12px 32px;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar > * {
        width: 100%;
      }

      button,
      select,
      input[type="password"] {
        width: 100%;
      }
    }
  </style>
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/bbox'] },
      tex: {
        packages: {'[+]': ['bbox']},
        inlineMath: [['$', '$']],
        displayMath: [['\\[','\\]'], ['$$','$$']],
        processEscapes: true,
        processEnvironments: true,
        macros: {
          hlblue: ['\\bbox[2px,lightskyblue]{#1}', 1],
          hlpink: ['\\bbox[2px,lightpink]{#1}', 1],
          hlgreen: ['\\bbox[2px,lightgreen]{#1}', 1]
        }
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
  <script src="/vendor/docx.iife.js" defer></script>
  <script src="/app-meta.js" defer></script>
</head>
<body>
  <header>
    <div>
      <div class="title-row">
        <h1>問題生成</h1>
        <span class="app-updated" data-app-updated>更新確認中</span>
      </div>
      <p>問題ごとに単元・項目名・難易度を選び、生成結果を確認してから出力できます。</p>
    </div>
    <div>
      <a href="/question-browser">作問結果ブラウザ</a>
      <a href="/">編集画面</a>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="toolbar">
        <label for="api-key-input">OpenAI APIキー</label>
        <input id="api-key-input" type="password" autocomplete="off" placeholder="APIキー" />
        <button id="api-key-btn" type="button">APIキー保存</button>
        <label for="question-count">問題数</label>
        <select id="question-count"></select>
        <button id="generate-btn" class="primary" type="button">生成</button>
      </div>
      <div class="toolbar">
        <progress id="progress-bar" max="1" value="0"></progress>
        <span id="progress-text">待機中</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>番号</th>
              <th>学年</th>
              <th>単元</th>
              <th>項目名</th>
              <th>難易度</th>
              <th>状態</th>
            </tr>
          </thead>
          <tbody id="condition-body"></tbody>
        </table>
      </div>
      <p id="status"></p>
    </section>

    <section id="results-panel" class="panel">
      <div class="output-actions">
        <button id="download-txt-btn" type="button" disabled>テキスト出力</button>
        <button id="download-problem-word-btn" type="button" disabled>問題のみWord出力</button>
        <button id="download-word-btn" type="button" disabled>Word出力</button>
        <button id="print-pdf-btn" type="button" disabled>PDF出力</button>
      </div>
      <div id="results-list">
        <p class="empty">生成結果はここに表示されます。</p>
      </div>
    </section>
  </main>

  <script>
    const apiKeyStorageKey = 'tikzAppOpenAIApiKey';
    const state = {
      catalog: [],
      results: [],
      running: false,
      renderPromise: Promise.resolve()
    };

    const countEl = document.getElementById('question-count');
    const bodyEl = document.getElementById('condition-body');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const generateBtn = document.getElementById('generate-btn');
    const resultsPanel = document.getElementById('results-panel');
    const resultsList = document.getElementById('results-list');

    function escapeForHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    async function waitForMathJaxReady(timeoutMs = 5000) {
      const startedAt = Date.now();
      while (!(window.MathJax && typeof MathJax.typesetPromise === 'function')) {
        if (Date.now() - startedAt > timeoutMs) return false;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return true;
    }

    function getApiKey() {
      const input = document.getElementById('api-key-input');
      return (input.value || localStorage.getItem(apiKeyStorageKey) || '').trim();
    }

    function updateApiKeyButtonState() {
      const btn = document.getElementById('api-key-btn');
      btn.textContent = getApiKey() ? 'APIキー保存済み' : 'APIキー保存';
    }

    function configureApiKey() {
      const apiKey = getApiKey();
      if (apiKey) {
        localStorage.setItem(apiKeyStorageKey, apiKey);
        setStatus('APIキーをブラウザに保存しました', 'ok');
      } else {
        localStorage.removeItem(apiKeyStorageKey);
        setStatus('APIキーを削除しました');
      }
      updateApiKeyButtonState();
    }

    function makeOption(value, text, title = '') {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = text;
      if (title) option.title = title;
      return option;
    }

    function getGrade(gradeValue) {
      return state.catalog.find(grade => grade.grade === gradeValue) || state.catalog[0];
    }

    function getUnit(gradeValue, unitName) {
      const grade = getGrade(gradeValue);
      return grade?.units.find(unit => unit.unit === unitName) || grade?.units[0];
    }

    function getItem(gradeValue, unitName, itemName) {
      const unit = getUnit(gradeValue, unitName);
      return unit?.items.find(item => item.item === itemName) || unit?.items[0];
    }

    function fillGradeSelect(selectEl, selectedValue = '') {
      selectEl.innerHTML = '';
      state.catalog.forEach(grade => {
        selectEl.appendChild(makeOption(grade.grade, grade.label));
      });
      if (selectedValue && state.catalog.some(grade => grade.grade === selectedValue)) {
        selectEl.value = selectedValue;
      }
    }

    function fillUnitSelect(selectEl, selectedValue = '') {
      const gradeValue = selectEl.closest('tr')?.querySelector('.grade-select')?.value || '';
      const grade = getGrade(gradeValue);
      selectEl.innerHTML = '';
      (grade?.units || []).forEach(unit => {
        selectEl.appendChild(makeOption(unit.unit, unit.unit));
      });
      if (selectedValue && grade?.units.some(unit => unit.unit === selectedValue)) {
        selectEl.value = selectedValue;
      }
    }

    function fillItemSelect(selectEl, gradeValue, unitName, selectedValue = '') {
      const unit = getUnit(gradeValue, unitName);
      selectEl.innerHTML = '';
      (unit?.items || []).forEach(item => {
        selectEl.appendChild(makeOption(item.item, item.item));
      });
      if (selectedValue && unit?.items.some(item => item.item === selectedValue)) {
        selectEl.value = selectedValue;
      }
    }

    function fillLevelSelect(selectEl, gradeValue, unitName, itemName, selectedValue = '') {
      const item = getItem(gradeValue, unitName, itemName);
      selectEl.innerHTML = '';
      (item?.levels || []).forEach(level => {
        const option = makeOption(level.fileName, level.level, level.label);
        option.dataset.label = level.label;
        option.dataset.code = level.code;
        option.dataset.level = level.level;
        option.dataset.title = level.title;
        selectEl.appendChild(option);
      });
      if (selectedValue && item?.levels.some(level => level.fileName === selectedValue)) {
        selectEl.value = selectedValue;
      }
    }

    function rowSelections() {
      return Array.from(bodyEl.querySelectorAll('tr')).map(row => ({
        grade: row.querySelector('.grade-select')?.value || '',
        unit: row.querySelector('.unit-select')?.value || '',
        item: row.querySelector('.item-select')?.value || '',
        fileName: row.querySelector('.level-select')?.value || ''
      }));
    }

    function updateRow(row, selected = {}) {
      const gradeSelect = row.querySelector('.grade-select');
      const unitSelect = row.querySelector('.unit-select');
      const itemSelect = row.querySelector('.item-select');
      const levelSelect = row.querySelector('.level-select');

      fillGradeSelect(gradeSelect, selected.grade);
      fillUnitSelect(unitSelect, selected.unit);
      fillItemSelect(itemSelect, gradeSelect.value, unitSelect.value, selected.item);
      fillLevelSelect(levelSelect, gradeSelect.value, unitSelect.value, itemSelect.value, selected.fileName);
    }

    function renderConditionRows() {
      const saved = rowSelections();
      const count = Number(countEl.value || 1);
      bodyEl.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const row = document.createElement('tr');
        row.dataset.index = String(i);
        row.innerHTML = `
          <td class="index-cell">問題${i + 1}</td>
          <td><select class="condition-select grade-select" aria-label="問題${i + 1} 学年"></select></td>
          <td><select class="condition-select unit-select" aria-label="問題${i + 1} 単元"></select></td>
          <td><select class="condition-select item-select" aria-label="問題${i + 1} 項目名"></select></td>
          <td><select class="condition-select level-select" aria-label="問題${i + 1} 難易度"></select></td>
          <td class="status-cell">待機中</td>
        `;
        bodyEl.appendChild(row);
        updateRow(row, saved[i] || {});

        row.querySelector('.grade-select').addEventListener('change', () => {
          updateRow(row, { grade: row.querySelector('.grade-select').value });
        });
        row.querySelector('.unit-select').addEventListener('change', () => {
          updateRow(row, {
            grade: row.querySelector('.grade-select').value,
            unit: row.querySelector('.unit-select').value
          });
        });
        row.querySelector('.item-select').addEventListener('change', () => {
          updateRow(row, {
            grade: row.querySelector('.grade-select').value,
            unit: row.querySelector('.unit-select').value,
            item: row.querySelector('.item-select').value
          });
        });
      }
    }

    function selectedLevelForRow(row) {
      const levelSelect = row.querySelector('.level-select');
      const selectedOption = levelSelect.selectedOptions[0];
      return {
        sourceFile: levelSelect.value,
        label: selectedOption?.dataset.label || selectedOption?.textContent || '',
        code: selectedOption?.dataset.code || '',
        title: selectedOption?.dataset.title || '',
        level: selectedOption?.dataset.level || ''
      };
    }

    function selectedConfigs() {
      return Array.from(bodyEl.querySelectorAll('tr')).map((row, index) => ({
        index,
        row,
        ...selectedLevelForRow(row)
      }));
    }

    function setRowStatus(row, message, type = '') {
      const statusCell = row.querySelector('.status-cell');
      statusCell.textContent = message;
      statusCell.style.color = type === 'error' ? 'var(--danger)' : type === 'ok' ? 'var(--ok)' : 'var(--muted)';
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '通信に失敗しました');
      return data;
    }

    async function waitForJob(jobId, onTick) {
      while (true) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        const job = await fetchJson(`/generate-jobs/${encodeURIComponent(jobId)}`);
        onTick(job);
        if (job.status === 'completed') return job;
        if (job.status === 'failed') throw new Error(job.error || '作問に失敗しました');
      }
    }

    async function generateOne(config, apiKey, totalCount) {
      setRowStatus(config.row, 'プロンプト読込中');
      const promptData = await fetchJson(`/prompt-files/${encodeURIComponent(config.sourceFile)}`);

      setRowStatus(config.row, '生成中');
      const job = await fetchJson('/generate-questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          apiKey,
          prompt: promptData.content || '',
          sourceFile: config.sourceFile,
          count: 1
        })
      });

      const completedJob = await waitForJob(job.id, latestJob => {
        setRowStatus(config.row, latestJob.message || '生成中');
      });
      const generated = (completedJob.files || [])[0];
      if (!generated) throw new Error('生成結果が空です');

      setRowStatus(config.row, '完了', 'ok');
      return {
        ...config,
        number: config.index + 1,
        fileName: generated.name,
        content: generated.content || '',
        generatedAt: new Date().toISOString(),
        totalCount
      };
    }

    function splitIntoSegments(text) {
      const segments = [];
      let pos = 0;
      while (pos < text.length) {
        const pTikz = text.indexOf('\\begin{tikzpicture}', pos);
        const cands = [
          { i: pTikz, type: 'tikz', end: '\\end{tikzpicture}' }
        ].filter(candidate => candidate.i !== -1).sort((a, b) => a.i - b.i);

        if (!cands.length) break;
        const next = cands[0];
        if (next.i > pos) segments.push({ type: 'text', content: text.slice(pos, next.i) });

        const endIndex = text.indexOf(next.end, next.i);
        if (endIndex === -1) {
          segments.push({ type: 'text', content: text.slice(next.i) });
          break;
        }

        segments.push({ type: next.type, code: text.slice(next.i, endIndex + next.end.length) });
        pos = endIndex + next.end.length;
      }
      if (pos < text.length) segments.push({ type: 'text', content: text.slice(pos) });
      return segments;
    }

    function tikzQuoteShim(code) {
      code = code.replace(/\\usetikzlibrary\{([^}]*)\}/g, (match, inner) => {
        if (!/\bquotes\b/.test(inner)) return match;
        const rest = inner.split(',').map(part => part.trim()).filter(part => part && part !== 'quotes');
        return rest.length ? `\\usetikzlibrary{${rest.join(',')}}` : '% quotes removed';
      });

      const re = /(--|to)\s*\[\s*(?:"([^"]+)"|'([^']+)')\s*((?:\s*,\s*[^,\]\r\n]+)*)\s*\]/g;
      return code.replace(re, (match, connector, dquoted, squoted, optRaw) => {
        const label = (dquoted ?? squoted ?? '').replace(/\\/g, '\\\\');
        let opts = (optRaw || '').trim().replace(/^\s*,/, '');
        const hasPos = /(?:^|,)\s*(pos\s*=|near\s*(?:start|end)|midway)\b/.test(opts);
        if (!hasPos) opts = opts ? `midway, ${opts}` : 'midway';
        const hasSide = /\b(above|below|left|right)\b/.test(opts);
        const hasAutoOrSwap = /\b(auto|swap)\b/.test(opts);
        if (!hasSide && !hasAutoOrSwap) opts = `${opts}, auto`;
        return `${connector} node[${opts}] {${label}}`;
      });
    }

    async function renderGeneratedContent(input, outputEl) {
      if (window.marked?.setOptions) {
        marked.setOptions({ gfm: true, breaks: true });
      }

      const segments = splitIntoSegments(input || '');
      const tikzPieces = [];

      for (const segment of segments) {
        if (segment.type !== 'tikz') continue;
        try {
          const response = await fetch('/render', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tikz: tikzQuoteShim(segment.code) })
          });
          if (!response.ok) throw new Error('TikZ render failed');
          const data = await response.json();
          tikzPieces.push(data.svg || '<p style="color:red">TikZ レンダリング失敗</p>');
        } catch (err) {
          console.error(err);
          tikzPieces.push(`<pre>${escapeForHtml(segment.code)}</pre>`);
        }
      }

      let tikzIndex = 0;
      let html = '';
      for (const segment of segments) {
        if (segment.type === 'tikz') {
          html += `<div class="segment">${tikzPieces[tikzIndex++] || ''}</div>`;
          continue;
        }

        const raw = segment.content || '';
        let htmlSegment = '';
        if (window.marked && typeof marked.parse === 'function') {
          const displayMathRegex = /\\\[[\s\S]*?\\\]/g;
          let lastIndex = 0;
          let match;

          while ((match = displayMathRegex.exec(raw)) !== null) {
            const beforeMath = raw.slice(lastIndex, match.index);
            if (beforeMath) {
              let parsed = marked.parse(beforeMath);
              if (window.DOMPurify?.sanitize) parsed = DOMPurify.sanitize(parsed);
              htmlSegment += parsed;
            }
            htmlSegment += `<div>${escapeForHtml(match[0])}</div>`;
            lastIndex = displayMathRegex.lastIndex;
          }

          const rest = raw.slice(lastIndex);
          if (rest) {
            let parsed = marked.parse(rest);
            if (window.DOMPurify?.sanitize) parsed = DOMPurify.sanitize(parsed);
            htmlSegment += parsed;
          }
        } else {
          htmlSegment = escapeForHtml(raw).replace(/\n/g, '<br>');
        }

        html += `<div class="segment">${htmlSegment}</div>`;
      }

      outputEl.innerHTML = html || '<p class="empty">内容がありません。</p>';
      if (await waitForMathJaxReady()) {
        await MathJax.typesetPromise([outputEl]);
      }
    }

    async function renderAllResultPreviews() {
      const previews = Array.from(resultsList.querySelectorAll('.result-preview'));
      for (const preview of previews) {
        const result = state.results.find(item => String(item.number) === preview.dataset.resultNumber);
        if (!result) continue;
        await renderGeneratedContent(result.content, preview);

    function renderResults() {
      resultsPanel.classList.add('active');
      const hasResults = state.results.length > 0;
      document.getElementById('download-txt-btn').disabled = !hasResults;
      document.getElementById('download-problem-word-btn').disabled = !hasResults;
      document.getElementById('download-word-btn').disabled = !hasResults;

        item.innerHTML = `
          <div class="result-head">

          </details>
        `;

        button.addEventListener('click', async () => {
          const number = Number(button.dataset.rerender);
          const textarea = resultsList.querySelector(`[data-result-number="${number}"].result-body`);
          const result = state.results.find(item => item.number === number);
          if (!textarea || !result) return;
          result.content = textarea.value;
          await renderAllResultPreviews();
        });
      });
      state.renderPromise = renderAllResultPreviews().catch(err => {
        console.error(err);
        setStatus('生成結果のレンダリングに失敗しました', 'error');
      });

    function currentResultContent() {
      return state.results.map(result => {
        const textarea = resultsList.querySelector(`textarea[data-result-number="${result.number}"]`);
        const content = textarea ? textarea.value : result.content;
        return [
          `# 問題${result.number}: ${result.label}`,
          `保存ファイル: ${result.fileName || ''}`,
          '',
          content
        ].join('\n');
      }).join('\n\n---\n\n');
    }

    function problemOnlyContent(content) {
      const source = String(content || '').replace(/\r\n/g, '\n');
      const answerHeading = /(?:^|\n)\s*(?:#{1,4}\s*)?(?:■\s*)?(?:【\s*(?:解答|答え|答|解説)\s*】|\[\s*(?:解答|答え|答|解説)\s*\]|(?:模範)?解答|答え|答|解説)\s*(?:\n|$)/;
      const match = source.match(answerHeading);
      const problem = match ? source.slice(0, match.index).trim() : source.trim();
      return problem || source.trim();
    }

    async function generateAll() {
      if (state.running) return;
      const apiKey = getApiKey();
      if (!apiKey) {
        setStatus('OpenAI APIキーを入力して保存してください', 'error');
        document.getElementById('api-key-input').focus();
        return;
      }

      const configs = selectedConfigs();
      if (configs.some(config => !config.sourceFile)) {
        setStatus('すべての問題で単元・項目名・難易度を選択してください', 'error');
        return;
      }

      state.running = true;
      state.results = [];
      generateBtn.disabled = true;
      progressBar.max = configs.length;
      progressBar.value = 0;
      progressText.textContent = `0/${configs.length}問`;
      setStatus('生成を開始しました');
      renderResults();

      configs.forEach(config => setRowStatus(config.row, '待機中'));

      try {
        for (const config of configs) {
          const result = await generateOne(config, apiKey, configs.length);
          state.results.push(result);
          progressBar.value = state.results.length;
          progressText.textContent = `${state.results.length}/${configs.length}問`;
          renderResults();
        }
        setStatus(`${state.results.length}問を生成しました`, 'ok');
      } catch (err) {
        console.error(err);
        setStatus(err.message || '生成に失敗しました', 'error');
      } finally {
        state.running = false;
        generateBtn.disabled = false;
      }
    }

    async function regenerateResult(number) {
      if (state.running) return;
      const apiKey = getApiKey();
      if (!apiKey) {
        setStatus('OpenAI APIキーを入力して保存してください', 'error');
        return;
      }

      const config = selectedConfigs()[number - 1];
      if (!config?.sourceFile) return;

      state.running = true;
      generateBtn.disabled = true;
      setStatus(`問題${number}を再生成しています`);

      try {
        const result = await generateOne(config, apiKey, state.results.length || Number(countEl.value || 1));
        const index = state.results.findIndex(item => item.number === number);
        if (index >= 0) state.results[index] = result;
        else state.results.push(result);
        renderResults();
        setStatus(`問題${number}を再生成しました`, 'ok');
      } catch (err) {
        console.error(err);
        setStatus(err.message || '再生成に失敗しました', 'error');
      } finally {
        state.running = false;
        generateBtn.disabled = false;
      }
    }

    function downloadBlob(fileName, mimeType, content) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

      downloadBlob('generated-questions.txt', 'text/plain;charset=utf-8', currentResultContent());
    }

    async function waitForRenderedPreviews() {
      await state.renderPromise;

    function svgSize(svg) {
      const viewBox = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
      const parseLength = value => {
        const text = String(value || '').trim();
        const number = parseFloat(text);
        if (!isFinite(number)) return 0;
        if (/ex$/.test(text)) return number * 8;
        if (/em$/.test(text)) return number * 16;
        if (/pt$/.test(text)) return number * 1.333;
        if (/cm$/.test(text)) return number * 37.795;
        if (/mm$/.test(text)) return number * 3.7795;
        if (/in$/.test(text)) return number * 96;
        return number;
      };

      let width = parseLength(svg.getAttribute('width'));
      let height = parseLength(svg.getAttribute('height'));
      if ((!width || !height) && viewBox.length === 4) {
        width = width || viewBox[2];
        height = height || viewBox[3];
      }
      width = Math.max(8, Math.min(1400, Math.ceil(width || 320)));
      height = Math.max(8, Math.min(1800, Math.ceil(height || 80)));
      return { width, height };
    }

    async function svgToPngBase64(svg) {
      const source = new XMLSerializer().serializeToString(svg);
      const { width, height } = svgSize(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      try {
        const image = new Image();
        image.decoding = 'async';
        const loaded = new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
        });
        image.src = url;
        await loaded;

        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(width * scale);
        canvas.height = Math.ceil(height * scale);
        const context = canvas.getContext('2d');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return {
          base64: canvas.toDataURL('image/png').split(',')[1],
          width,
          height
        };
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function renderedHtmlForExport(number, imageStore = null) {
      const preview = resultsList.querySelector(`.result-preview[data-result-number="${number}"]`);
      if (!preview) return '';

      const clone = preview.cloneNode(true);
      clone.querySelectorAll('mjx-assistive-mml').forEach(node => node.remove());
      clone.querySelectorAll('mjx-container').forEach(container => {
        const svg = container.querySelector('svg');
        const wrapper = document.createElement(container.getAttribute('display') === 'true' ? 'div' : 'span');
        wrapper.className = container.getAttribute('display') === 'true' ? 'math-display' : 'math-inline';
        if (svg) {
          wrapper.innerHTML = svg.outerHTML;
        } else {
          wrapper.textContent = container.textContent || '';
        }
        container.replaceWith(wrapper);
      });
      if (imageStore) {
        const svgs = Array.from(clone.querySelectorAll('svg'));
        for (const svg of svgs) {
          try {
            const png = await svgToPngBase64(svg);
            const name = `image${String(imageStore.length + 1).padStart(3, '0')}.png`;
            imageStore.push({ name, base64: png.base64 });

            const img = document.createElement('img');
            img.src = name;
            img.width = png.width;
            img.height = png.height;
            img.style.maxWidth = '100%';
            img.style.height = 'auto';
            svg.replaceWith(img);
          } catch (err) {
            console.error('Failed to convert SVG for Word export:', err);
          }
        }
      }
      return clone.innerHTML;
    }

    function buildWordMhtml(html, images) {
      const boundary = `----=_NextPart_${Date.now()}`;
      const parts = [
        'MIME-Version: 1.0',
        `Content-Type: multipart/related; boundary="${boundary}"; type="text/html"`,
        '',
        `--${boundary}`,
        'Content-Type: text/html; charset="utf-8"',
        'Content-Transfer-Encoding: 8bit',
        'Content-Location: generated-questions.html',
        '',
        html
      ];

      images.forEach(image => {
        parts.push(
          `--${boundary}`,
          'Content-Type: image/png',
          'Content-Transfer-Encoding: base64',
          `Content-Location: ${image.name}`,
          '',
          image.base64.replace(/(.{76})/g, '$1\n')
        );
      });

      parts.push(`--${boundary}--`, '');
      return parts.join('\n');
    }

    async function waitForDocxReady(timeoutMs = 7000) {
      const startedAt = Date.now();
      while (!window.docx) {
        if (Date.now() - startedAt > timeoutMs) return false;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return true;
    }

    function base64ToUint8Array(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function docxImageRunFromPng(png, maxWidth = 520) {
      const { ImageRun } = window.docx;
      const width = Math.max(8, Math.round(png.width || 320));
      const height = Math.max(8, Math.round(png.height || 80));
      const scale = Math.min(1, maxWidth / width);
      return new ImageRun({
        data: base64ToUint8Array(png.base64),
        type: 'png',
        transformation: {
          width: Math.round(width * scale),
          height: Math.round(height * scale)
        }
      });
    }

    function normalizeTextForDocx(text) {
      return String(text || '').replace(/\s+/g, ' ');
    }

    function cleanDocxText(text) {
      return String(text || '')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/^#+\s*/, '')
        .trim();
    }

    function findMatchingBrace(text, startIndex, open = '{', close = '}') {
      let depth = 0;
      for (let i = startIndex; i < text.length; i++) {
        if (text[i] === open) depth++;
        if (text[i] === close) {
          depth--;
          if (depth === 0) return i;
        }
      }
      return -1;
    }

    function normalizeTeX(tex) {
      return String(tex || '')
        .replace(/\\begin\{(?:aligned|align\*?|gathered|gather\*?)\}/g, '')
        .replace(/\\end\{(?:aligned|align\*?|gathered|gather\*?)\}/g, '')
        .replace(/\\left\b/g, '')
        .replace(/\\right\b/g, '')
        .replace(/\\tfrac/g, '\\frac')
        .replace(/\\dfrac/g, '\\frac')
        .replace(/\\,/g, ' ')
        .replace(/\\\\/g, '  ')
        .replace(/&/g, '')
        .trim();
    }

    function texSymbol(command) {
      const symbols = {
        times: '×',
        div: '÷',
        cdot: '⋅',
        cdots: '⋯',
        dots: '…',
        ldots: '…',
        vdots: '⋮',
        ddots: '⋱',
        pm: '±',
        mp: '∓',
        quad: '  ',
        qquad: '    ',
        le: '≤',
        leq: '≤',
        leqq: '≦',
        leqslant: '≤',
        ge: '≥',
        geq: '≥',
        geqq: '≧',
        geqslant: '≥',
        neq: '≠',
        ne: '≠',
        lt: '<',
        gt: '>',
        perp: '⊥',
        parallel: '∥',
        angle: '∠',
        triangle: '△',
        therefore: '∴',
        because: '∵',
        sim: '∼',
        cong: '≅',
        equiv: '≡',
        approx: '≈',
        fallingdotseq: '≒',
        risingdotseq: '≓',
        simeq: '≃',
        propto: '∝',
        frown: '⌢',
        smile: '⌣',
        infty: '∞',
        circ: '°',
        degree: '°',
        pi: 'π',
        theta: 'θ',
        alpha: 'α',
        beta: 'β',
        gamma: 'γ',
        Delta: '△',
        rightarrow: '→',
        leftarrow: '←',
        to: '→'
      };
      return symbols[command] || command;
    }

    function overlineText(text) {
      return Array.from(String(text || '').replace(/\s+/g, '')).map(char => `${char}\u0305`).join('');
    }

    function arcText(text) {
      const chars = Array.from(String(text || '').replace(/\s+/g, ''));
      if (chars.length === 2) return `${chars[0]}\u0361${chars[1]}`;
      return chars.join('');
    }

    function parseTeXGroup(tex, startIndex) {
      if (tex[startIndex] !== '{') return { content: tex[startIndex] || '', end: startIndex + 1 };
      const end = findMatchingBrace(tex, startIndex);
      if (end === -1) return { content: tex.slice(startIndex + 1), end: tex.length };
      return { content: tex.slice(startIndex + 1, end), end: end + 1 };
    }

    function parseTeXAtom(tex, index) {
      const {
        MathRun,
        MathFraction,
        MathRadical,
        MathRoundBrackets,
        MathSquareBrackets,
        MathCurlyBrackets
      } = window.docx;

      if (tex[index] === '{') {
        const group = parseTeXGroup(tex, index);
        return { components: parseTeXToMathChildren(group.content), end: group.end };
      }

      if (tex[index] === '\\') {
        const commandMatch = tex.slice(index + 1).match(/^([A-Za-z]+)/);
        if (!commandMatch) {
          const spacing = { ',': ' ', ';': ' ', ':': ' ', '!': '' };
          const next = tex[index + 1] || '';
          return { components: [new MathRun(Object.prototype.hasOwnProperty.call(spacing, next) ? spacing[next] : next)], end: index + 2 };
        }
        const command = commandMatch[1];
        let pos = index + 1 + command.length;

        if (command === 'frac') {
          while (/\s/.test(tex[pos])) pos++;
          const numerator = parseTeXGroup(tex, pos);
          pos = numerator.end;
          while (/\s/.test(tex[pos])) pos++;
          const denominator = parseTeXGroup(tex, pos);
          return {
            components: [new MathFraction({
              numerator: parseTeXToMathChildren(numerator.content),
              denominator: parseTeXToMathChildren(denominator.content)
            })],
            end: denominator.end
          };
        }

        if (command === 'sqrt') {
          while (/\s/.test(tex[pos])) pos++;
          const radical = parseTeXGroup(tex, pos);
          return {
            components: [new MathRadical({ children: parseTeXToMathChildren(radical.content) })],
            end: radical.end
          };
        }

        if (command === 'text' || command === 'mathrm') {
          while (/\s/.test(tex[pos])) pos++;
          const group = parseTeXGroup(tex, pos);
          return { components: [new MathRun(group.content)], end: group.end };
        }

        if (command === 'hlblue' || command === 'hlpink' || command === 'hlgreen') {
          while (/\s/.test(tex[pos])) pos++;
          const group = parseTeXGroup(tex, pos);
          return { components: parseTeXToMathChildren(group.content), end: group.end };
        }

        if (command === 'overline' || command === 'bar') {
          while (/\s/.test(tex[pos])) pos++;
          const group = parseTeXGroup(tex, pos);
          return { components: [new MathRun(overlineText(group.content))], end: group.end };
        }

        if (command === 'overset') {
          while (/\s/.test(tex[pos])) pos++;
          const top = parseTeXGroup(tex, pos);
          pos = top.end;
          while (/\s/.test(tex[pos])) pos++;
          const base = parseTeXGroup(tex, pos);
          const topText = top.content.replace(/\s+/g, '');
          if (/\\frown|frown|⌢/.test(topText)) {
            return { components: [new MathRun(arcText(base.content))], end: base.end };
          }
          return {
            components: [
              ...parseTeXToMathChildren(base.content),
              new MathRun(texSymbol(topText.replace(/^\\/, '')))
            ],
            end: base.end
          };
        }

        if (command === 'begin' || command === 'end') {
          while (/\s/.test(tex[pos])) pos++;
          const group = parseTeXGroup(tex, pos);
          return { components: [], end: group.end };
        }

        if (command === 'left' || command === 'right') {
          return { components: [], end: pos };
        }

        return { components: [new MathRun(texSymbol(command))], end: pos };
      }

      const char = tex[index];
      if (char === '(' || char === '[' || char === '{') {
        const close = char === '(' ? ')' : char === '[' ? ']' : '}';
        const end = findMatchingBrace(tex, index, char, close);
        if (end !== -1) {
          const children = parseTeXToMathChildren(tex.slice(index + 1, end));
          if (char === '(') return { components: [new MathRoundBrackets({ children })], end: end + 1 };
          if (char === '[') return { components: [new MathSquareBrackets({ children })], end: end + 1 };
          return { components: [new MathCurlyBrackets({ children })], end: end + 1 };
        }
      }

      return { components: [new MathRun(char)], end: index + 1 };
    }

    function parseTeXScript(tex, index) {
      while (/\s/.test(tex[index])) index++;
      if (tex[index] === '{') {
        const group = parseTeXGroup(tex, index);
        return { components: parseTeXToMathChildren(group.content), end: group.end };
      }
      const atom = parseTeXAtom(tex, index);
      return { components: atom.components, end: atom.end };
    }

    function parseTeXToMathChildren(input) {
      const {
        MathRun,
        MathSuperScript,
        MathSubScript,
        MathSubSuperScript
      } = window.docx;
      const tex = normalizeTeX(input);
      const components = [];
      let buffer = '';
      let index = 0;

      const flush = () => {
        if (buffer) {
          components.push(new MathRun(buffer));
          buffer = '';
        }
      };

      while (index < tex.length) {
        const char = tex[index];
        if (char === '^' || char === '_') {
          flush();
          const base = components.pop() || new MathRun('');
          const firstKind = char;
          const first = parseTeXScript(tex, index + 1);
          index = first.end;

          let subScript = firstKind === '_' ? first.components : null;
          let superScript = firstKind === '^' ? first.components : null;
          if ((tex[index] === '^' || tex[index] === '_') && tex[index] !== firstKind) {
            const secondKind = tex[index];
            const second = parseTeXScript(tex, index + 1);
            index = second.end;
            if (secondKind === '_') subScript = second.components;
            if (secondKind === '^') superScript = second.components;
          }

          if (subScript && superScript) {
            components.push(new MathSubSuperScript({ children: [base], subScript, superScript }));
          } else if (subScript) {
            components.push(new MathSubScript({ children: [base], subScript }));
          } else {
            components.push(new MathSuperScript({ children: [base], superScript }));
          }
          continue;
        }

        if (char === '\\' || char === '{' || char === '(' || char === '[') {
          flush();
          const atom = parseTeXAtom(tex, index);
          components.push(...atom.components);
          index = atom.end;
          continue;
        }

        buffer += char;
        index++;
      }

      flush();
      return components.length ? components : [new MathRun('')];
    }

    function mathComponent(tex) {
      return new window.docx.Math({ children: parseTeXToMathChildren(tex) });
    }

    function parseInlineMathToDocxRuns(text, inherited = {}) {
      const { TextRun } = window.docx;
      const runs = [];
      const source = String(text || '');
      const regex = /(\\\(([\s\S]*?)\\\)|\$([^$\n]+)\$)/g;
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(source)) !== null) {
        const plain = cleanDocxText(source.slice(lastIndex, match.index));
        if (plain) runs.push(new TextRun({ text: plain, ...inherited }));
        runs.push(mathComponent(match[2] || match[3] || ''));
        lastIndex = regex.lastIndex;
      }

      const rest = cleanDocxText(source.slice(lastIndex));
      if (rest) runs.push(new TextRun({ text: rest, ...inherited }));
      return runs;
    }

    function splitDisplayMathBlocks(text) {
      const blocks = [];
      const regex = /(\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$)/g;
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          blocks.push({ type: 'text', content: text.slice(lastIndex, match.index) });
        }
        const raw = match[0];
        const tex = raw.startsWith('$$') ? raw.slice(2, -2) : raw.slice(2, -2);
        blocks.push({ type: 'math', content: tex });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) blocks.push({ type: 'text', content: text.slice(lastIndex) });
      return blocks;
    }

    function splitTeXRowCells(row) {
      const cells = [];
      let depth = 0;
      let start = 0;
      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '\\') {
          i++;
          continue;
        }
        if (char === '{') depth++;
        if (char === '}') depth = Math.max(0, depth - 1);
        if (char === '&' && depth === 0) {
          cells.push(row.slice(start, i).trim());
          start = i + 1;
        }
      }
      cells.push(row.slice(start).trim());
      return cells;
    }

    function parseArrayTable(tex) {
      const source = String(tex || '').trim();
      const match = source.match(/^\\begin\{array\}\{([^}]*)\}([\s\S]*?)\\end\{array\}$/);
      if (!match) return null;

      const columns = match[1].replace(/\|/g, '').replace(/[^clr]/g, '').length || 1;
      const body = match[2]
        .replace(/\\hline/g, '')
        .split(/\\\\/)
        .map(row => row.trim())
        .filter(Boolean);

      const rows = body.map(row => {
        const cells = splitTeXRowCells(row);
        while (cells.length < columns) cells.push('');
        return cells.slice(0, columns);
      }).filter(row => row.some(cell => cell.trim()));

      return rows.length ? { columns, rows } : null;
    }

    function arrayTableToDocxTable(tex) {
      const parsed = parseArrayTable(tex);
      if (!parsed) return null;

      const { Table, TableRow, TableCell, Paragraph, WidthType, AlignmentType } = window.docx;
      const columnWidth = Math.floor(100 / parsed.columns);
      return new Table({
        width: { size: 100, type: WidthType.PERCENTAGE },
        rows: parsed.rows.map(row => new TableRow({
          children: row.map(cell => new TableCell({
            width: { size: columnWidth, type: WidthType.PERCENTAGE },
            margins: { top: 80, bottom: 80, left: 100, right: 100 },
            children: [
              new Paragraph({
                children: [mathComponent(cell || ' ')],
                alignment: AlignmentType.CENTER
              })
            ]
          }))
        }))
      });
    }

    async function nodeToDocxRuns(node, inherited = {}) {
      const { TextRun, ImageRun } = window.docx;

      if (node.nodeType === Node.TEXT_NODE) {
        const text = normalizeTextForDocx(node.textContent);
        return text ? [new TextRun({ text, ...inherited })] : [];
      }

      if (node.nodeType !== Node.ELEMENT_NODE) return [];

      const tag = node.tagName.toLowerCase();
      if (tag === 'br') return [new TextRun({ text: '', break: 1 })];

      if (tag === 'svg') {
        const png = await svgToPngBase64(node);
        return [docxImageRunFromPng(png)];
      }

      if (tag === 'img') {
        const src = node.getAttribute('src') || '';
        if (src.startsWith('data:image/png;base64,')) {
          const width = Number(node.getAttribute('width')) || 120;
          const height = Number(node.getAttribute('height')) || 40;
          return [new ImageRun({
            data: base64ToUint8Array(src.split(',')[1]),
            type: 'png',
            transformation: { width, height }
          })];
        }
        return [];
      }

      const nextInherited = {
        ...inherited,
        bold: inherited.bold || tag === 'strong' || tag === 'b',
        italics: inherited.italics || tag === 'em' || tag === 'i'
      };
      const runs = [];
      for (const child of Array.from(node.childNodes)) {
        runs.push(...await nodeToDocxRuns(child, nextInherited));
      }
      return runs;
    }

    async function elementToDocxParagraphs(element) {
      const { Paragraph, TextRun, AlignmentType, HeadingLevel } = window.docx;
      const paragraphs = [];
      const blockSelector = 'h1,h2,h3,p,div.segment,div.math-display,ul,ol,li';
      const blocks = Array.from(element.querySelectorAll(blockSelector))
        .filter(node => !node.closest('mjx-assistive-mml'));

      for (const block of blocks) {
        if (block.matches('ul,ol')) continue;
        if (block.closest('li') && !block.matches('li')) continue;

        const runs = await nodeToDocxRuns(block, {
          bold: block.matches('h1,h2,h3,strong,b')
        });
        if (!runs.length) continue;

        const isHeading = block.matches('h1,h2,h3');
        const isDisplayMath = block.classList.contains('math-display') || block.querySelector(':scope > mjx-container[display="true"], :scope > svg');
        paragraphs.push(new Paragraph({
          children: runs,
          heading: isHeading ? HeadingLevel.HEADING_2 : undefined,
          bullet: block.matches('li') ? { level: 0 } : undefined,
          alignment: isDisplayMath ? AlignmentType.CENTER : undefined,
          spacing: { after: isHeading ? 160 : 120 }
        }));
      }

      if (!paragraphs.length) {
        paragraphs.push(new Paragraph({ children: [new TextRun('')] }));
      }
      return paragraphs;
    }

    async function tikzToDocxParagraph(code) {
      const { Paragraph, TextRun, AlignmentType } = window.docx;
      try {
        const response = await fetch('/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tikz: tikzQuoteShim(code) })
        });
        if (!response.ok) throw new Error('TikZ render failed');
        const data = await response.json();
        const doc = new DOMParser().parseFromString(data.svg || '', 'image/svg+xml');
        const svg = doc.querySelector('svg');
        if (!svg) throw new Error('TikZ render did not return SVG');
        const png = await svgToPngBase64(svg);
        return new Paragraph({
          children: [docxImageRunFromPng(png)],
          alignment: AlignmentType.CENTER,
          spacing: { before: 80, after: 180 }
        });
      } catch (err) {
        console.error('Failed to render TikZ for Word export:', err);
        return new Paragraph({
          children: [new TextRun({ text: '【図のレンダリングに失敗しました】', bold: true, color: 'D32F2F' })],
          spacing: { before: 80, after: 120 }
        });
      }
    }

    async function rawTextToDocxParagraphs(content) {
      const { Paragraph, TextRun, AlignmentType } = window.docx;
      const paragraphs = [];
      const segments = splitIntoSegments(content || '');

      for (const segment of segments) {
        if (segment.type === 'tikz') {
          paragraphs.push(await tikzToDocxParagraph(segment.code));
          continue;
        }

        const blocks = splitDisplayMathBlocks(segment.content || '');

        for (const block of blocks) {
          if (block.type === 'math') {
            const table = arrayTableToDocxTable(block.content);
            if (table) {
              paragraphs.push(table);
              continue;
            }

            paragraphs.push(new Paragraph({
              children: [mathComponent(block.content)],
              alignment: AlignmentType.CENTER,
              spacing: { after: 140 }
            }));
            continue;
          }

          const lines = block.content.split(/\r?\n/);
          for (const line of lines) {
            const rawLine = line.trim();
            if (!rawLine) continue;

            const bold = /^(\*\*.*\*\*|■|【|ステップ|間違えやすいポイント)/.test(rawLine);
            const runs = parseInlineMathToDocxRuns(rawLine, { bold });
            if (!runs.length) runs.push(new TextRun(''));

            paragraphs.push(new Paragraph({
              children: runs,
              spacing: { after: bold ? 120 : 100 }
            }));
          }
        }
      }

      if (!paragraphs.length) {
        paragraphs.push(new Paragraph({ children: [new TextRun('')] }));
      }
      return paragraphs;
    }

    async function previewToDocxParagraphs(result, options = {}) {
      const { Paragraph, TextRun, HeadingLevel } = window.docx;
      const paragraphs = [
        new Paragraph({
          heading: HeadingLevel.HEADING_2,
          children: [new TextRun({ text: `問題${result.number}: ${result.label}`, bold: true })],
          spacing: { after: 80 }
        }),
        new Paragraph({
          children: [new TextRun({ text: result.fileName || '', size: 18 })],
          spacing: { after: 180 }
        })
      ];

      const content = options.problemOnly ? problemOnlyContent(result.content || '') : result.content || '';
      paragraphs.push(...await rawTextToDocxParagraphs(content));
      return paragraphs;
    }

    async function downloadWord(options = {}) {
      await syncEditedResultsToPreview();
      await waitForRenderedPreviews();
      if (!await waitForDocxReady()) {
        setStatus('Word出力ライブラリを読み込めませんでした。ページを再読み込みしてください', 'error');
        return;
      }

      const { Document, Packer, Paragraph, PageBreak } = window.docx;
      const children = [];
      for (const result of state.results) {
        if (children.length) children.push(new Paragraph({ children: [new PageBreak()] }));
        children.push(...await previewToDocxParagraphs(result, options));
      }

      const doc = new Document({
        sections: [{
          properties: {
            page: {
              margin: { top: 900, right: 900, bottom: 900, left: 900 }
            }
          },
          children
        }]
      });
      const blob = await Packer.toBlob(doc);
      const fileName = options.problemOnly ? 'generated-questions-problems.docx' : 'generated-questions.docx';
      downloadBlob(fileName, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', blob);
    }

    window.questionWordExport = {
      async ready() {
        return waitForDocxReady();
      },
      async buildDocxBlob(result, options = {}) {
        if (!await waitForDocxReady()) {
          throw new Error('Word出力ライブラリを読み込めませんでした');
        }

        const { Document, Packer } = window.docx;
        const children = await previewToDocxParagraphs(result, options);
        const doc = new Document({
          sections: [{
            properties: {
              page: {
                margin: { top: 900, right: 900, bottom: 900, left: 900 }
              }
            },
            children
          }]
        });
        return Packer.toBlob(doc);
      }
    };

    async function syncEditedResultsToPreview() {
      let changed = false;
      for (const result of state.results) {
        const textarea = resultsList.querySelector(`textarea[data-result-number="${result.number}"]`);
        if (textarea && textarea.value !== result.content) {
          result.content = textarea.value;
          changed = true;
        }
      }
      if (changed) await renderAllResultPreviews();
    }

    async function printPdf() {
      await syncEditedResultsToPreview();
      await waitForRenderedPreviews();
      const sections = [];
      for (const result of state.results) {
        const content = await renderedHtmlForExport(result.number) || escapeForHtml(result.content);
        sections.push(`
          <section>
            <h2>問題${result.number}: ${escapeForHtml(result.label)}</h2>
            <p class="file">${escapeForHtml(result.fileName || '')}</p>
            <div class="rendered">${content}</div>
          </section>
        `);
      }
      const win = window.open('', '_blank');
      if (!win) {
        setStatus('PDF出力用のウィンドウを開けませんでした', 'error');
        return;
      }
      win.document.write(`
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <title>生成問題</title>
          <style>
            @page { margin: 18mm; }
            body { font-family: "Yu Gothic", sans-serif; line-height: 1.7; color: #111; font-size: 12px; }
            section { break-inside: avoid; page-break-inside: avoid; margin-bottom: 24px; }
            h2 { font-size: 15px; margin: 0 0 4px; }
            .file { color: #555; font-size: 11px; margin: 0 0 10px; }
            .rendered h1, .rendered h2, .rendered h3 { line-height: 1.35; }
            .rendered table { border-collapse: collapse; margin: 0.75em 0 1em; max-width: 100%; width: fit-content; display: block; overflow-x: auto; }
            .rendered th, .rendered td { border: 1px solid #999; padding: 4px 10px; text-align: right; white-space: nowrap; }
            .rendered svg { max-width: 100%; height: auto; }
            .rendered .segment > svg { display: block; margin-left: auto; margin-right: auto; }
            mjx-container[jax="SVG"][display="true"] { display: block; text-align: center; margin: 1em 0; }
            mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; vertical-align: -0.2em; margin: 0 .1em; }
            hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
          </style>
        </head>
        <body>${sections.join('')}</body>
        </html>
      `);
      win.document.close();
      win.focus();
      win.print();
    }

    async function loadCatalog() {
      setStatus('単元一覧を読み込み中...');
      const data = await fetchJson('/prompt-catalog');
      state.catalog = Array.isArray(data.grades) ? data.grades : [];
      if (!state.catalog.length) {
        setStatus('利用できるプロンプトがありません', 'error');
        generateBtn.disabled = true;
        return;
      }
      renderConditionRows();
      setStatus('');
    }

    function initQuestionCount() {
      for (let i = 1; i <= 10; i++) {
        countEl.appendChild(makeOption(String(i), `${i}問`));
      }
      countEl.value = '1';
    }

    document.getElementById('api-key-btn').addEventListener('click', configureApiKey);
    document.getElementById('api-key-input').addEventListener('input', updateApiKeyButtonState);
    document.getElementById('api-key-input').addEventListener('keydown', event => {
      if (event.key === 'Enter') configureApiKey();
    });
    countEl.addEventListener('change', renderConditionRows);
    generateBtn.addEventListener('click', generateAll);
    document.getElementById('download-txt-btn').addEventListener('click', downloadText);
    document.getElementById('download-problem-word-btn').addEventListener('click', () => downloadWord({ problemOnly: true }));
    document.getElementById('download-word-btn').addEventListener('click', () => downloadWord());
    document.getElementById('print-pdf-btn').addEventListener('click', printPdf);

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('api-key-input').value = localStorage.getItem(apiKeyStorageKey) || '';
      updateApiKeyButtonState();
      initQuestionCount();
      try {
        await loadCatalog();
      } catch (err) {
        console.error(err);
        setStatus(err.message || '単元一覧の読み込みに失敗しました', 'error');
      }
    });
  </script>
</body>
</html>
