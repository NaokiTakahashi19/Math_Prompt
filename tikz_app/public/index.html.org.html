<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikZ Renderer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 20px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ddd;
    }
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    textarea {
      width: 50%;
      height: 100%;
      border: none;
      padding: 15px;
      box-sizing: border-box;
      resize: none;
      font-family: "Courier New", monospace;
      font-size: 14px;
      border-right: 1px solid #ddd;
    }
    #output {
      width: 50%;
      padding: 15px;
      overflow: auto;
      white-space: normal;
    }
    .actions {
      padding: 10px;
      border-top: 1px solid #ddd;
      background-color: #fafafa;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .segment { margin-bottom: 20px; }

    /* TikZ/graf の“直下の”SVGだけ中央寄せ（MathJaxのSVGは除外） */
    #output .segment > svg {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* MathJax(SVG) の表示モードを明示してインライン崩れ防止 */
    mjx-container[jax="SVG"][display="true"] {
      display: block;
      text-align: center;
      margin: 1em 0;
    }
    mjx-container[jax="SVG"]:not([display="true"]) {
      display: inline-block;
      vertical-align: -0.2em;
      margin: 0 .1em;
    }
  </style>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],                 // 必要なら ['\\(', '\\)'] を追加
        displayMath: [['\\[','\\]'], ['$$','$$']], // $$ も許可
        processEscapes: true,
        processEnvironments: true
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: { '[-]': ['script','noscript','style','textarea','pre'] } }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

  <!-- Markdown & Sanitize -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>

  <!-- TikZJax: /render 失敗時のフォールバック -->
  <link rel="stylesheet" href="https://tikzjax.com/v1/fonts.css">
  <script src="https://tikzjax.com/v1/tikzjax.js" defer></script>
</head>

<body>
  <header>
    <h1>TikZ 図形レンダラー</h1>
    <p>左側に入力し「レンダリング」を押すと右側に表示します（Markdown / TeX / TikZ / graf）。</p>
  </header>

  <div class="container">
    <textarea id="tikz-input" spellcheck="false">% サンプル: TikZ, グラフ, 平文, LaTeX 数式, Markdown の例です
\begin{tikzpicture}[>=latex]
  \draw (0,0) circle (1);
  \draw (0,0) -- (60:2) arc (60:0:2) -- cycle;
  \draw (3,0) -- (3+1.732,0) -- (3,1) -- cycle;
  \draw (0,-1) rectangle (2,-2);
  \draw (3,-1) -- (4,-2) -- (6,-2) -- (5,-1) -- cycle;
  \draw (0,2) -- (2,2);
  \draw (1,2) -- ++(45:1.5);
\end{tikzpicture}

\begin{graf}
X=-3,4
Y=-2,5
y = \frac{1}{2}x^2,red,$y=\tfrac{1}{2}x^2$
y = 3x + \frac{1}{2},blue,$y=3x+\tfrac{1}{2}$
(3, 4),magenta,A
Scale_grid_color = cyan
scales = 2
\end{graf}

こんにちは、**Markdown** の *例* です！

$x$ はインライン数式の例です。

$$
\frac{1}{3}
$$

\[
\frac{1}{3}
\]
</textarea>

    <div id="output">レンダリング結果がこちらに表示されます。</div>
  </div>

  <div class="actions">
    <button id="render-btn">レンダリング</button>
    <span id="status" style="margin-left: 10px; color: #888;"></span>
  </div>

  <script>
    // --- 小道具 ---
    function escapeForHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 入力を tikz/graf/それ以外 に分割
    function splitIntoSegments(text) {
      const segments = [];
      let pos = 0;
      while (pos < text.length) {
        const tikzStart = text.indexOf('\\begin{tikzpicture}', pos);
        const grafStart = text.indexOf('\\begin{graf}', pos);
        let nextStart = -1, envType = null;
        if (tikzStart !== -1 && (grafStart === -1 || tikzStart < grafStart)) {
          nextStart = tikzStart; envType = 'tikz';
        } else if (grafStart !== -1) {
          nextStart = grafStart; envType = 'graf';
        }
        if (nextStart === -1) break;

        if (nextStart > pos) segments.push({ type:'text', content: text.slice(pos, nextStart) });

        const endTag = envType === 'tikz' ? '\\end{tikzpicture}' : '\\end{graf}';
        const endIndex = text.indexOf(endTag, nextStart);
        if (endIndex === -1) { segments.push({ type:'text', content: text.slice(nextStart) }); break; }

        const envContent = text.slice(nextStart, endIndex + endTag.length);
        segments.push(envType === 'tikz' ? { type:'tikz', code: envContent } : { type:'graf', code: envContent });
        pos = endIndex + endTag.length;
      }
      if (pos < text.length) segments.push({ type:'text', content: text.slice(pos) });
      return segments;
    }

    // --- \usetikzlibrary{quotes} 相当のシム（quotes風 → node[...] 変換） ---
    function tikzQuoteShim(code) {
      code = code.replace(/\\usetikzlibrary\{([^}]*)\}/g, (m, inner) => {
        if (!/\bquotes\b/.test(inner)) return m;
        const rest = inner.split(',').map(s => s.trim()).filter(s => s && s !== 'quotes');
        return rest.length ? `\\usetikzlibrary{${rest.join(',')}}` : '% quotes removed';
      });

      const re = /(--|to)\s*\[\s*(?:"([^"]+)"|'([^']+)')\s*((?:\s*,\s*[^,\]\r\n]+)*)\s*\]/g;
      code = code.replace(re, (m, connector, dquoted, squoted, optRaw) => {
        const label = (dquoted ?? squoted ?? '').replace(/\\/g, '\\\\');
        let opts = (optRaw || '').trim().replace(/^\s*,/, '');
        const hasPos = /(?:^|,)\s*(pos\s*=|near\s*(?:start|end)|midway)\b/.test(opts);
        if (!hasPos) opts = opts ? `midway, ${opts}` : 'midway';
        const hasSide = /\b(above|below|left|right)\b/.test(opts);
        const hasAutoOrSwap = /\b(auto|swap)\b/.test(opts);
        if (!hasSide && !hasAutoOrSwap) opts = `${opts}, auto`;
        return `${connector} node[${opts}] {${label}}`;
      });

      return code;
    }

    // --- graf の簡易レンダラ（SVG生成） ---
    function renderGraf(grafCode) {
      let body = grafCode.replace(/\\begin\{graf\}/,'').replace(/\\end\{graf\}/,'').trim();
      const lines = body.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let xRange = [-5,5], yRange = [-5,5], gridScale = 0, gridColor = '#eee';
      const functions = [], points = [];
      let hUnits, wUnits, axisXUnits, axisYUnits;

      for (const line of lines) {
        if (/^X\s*=/.test(line)) {
          const [a,b] = line.split('=')[1].split(',').map(s=>parseFloat(s.trim()));
          if (isFinite(a) && isFinite(b)) xRange = [a,b];
        } else if (/^Y\s*=/.test(line)) {
          const [c,d] = line.split('=')[1].split(',').map(s=>parseFloat(s.trim()));
          if (isFinite(c) && isFinite(d)) yRange = [c,d];
        } else if (/^scales?\s*=/.test(line)) {
          const v = parseInt(line.split('=')[1].trim(),10); if (!isNaN(v)&&v>0) gridScale = v;
        } else if (/^scale_grid_color\s*=|^Scale_grid_color\s*=/i.test(line)) {
          const col = line.split('=')[1]?.trim(); if (col) gridColor = col;
        } else if (/^[Hh]\s*=/.test(line)) {
          const v = parseFloat(line.split('=')[1]); if (!isNaN(v)&&v>0) hUnits = v;
        } else if (/^[Ww]\s*=/.test(line)) {
          const v = parseFloat(line.split('=')[1]); if (!isNaN(v)&&v>0) wUnits = v;
        } else if (/^[Aa]xis\s*=/.test(line)) {
          const [p,q] = line.split('=')[1].split(',').map(s=>parseFloat(s.trim()));
          if (isFinite(p) && isFinite(q)) { axisXUnits = p; axisYUnits = q; }
        } else if (/^\(.*\)/.test(line)) {
          const m = line.split(','); const c = m[0].match(/\(([^,]+)\s*,\s*([^)]+)\)/);
          if (c) {
            const px = parseFloat(c[1]), py = parseFloat(c[2]);
            if (isFinite(px) && isFinite(py)) points.push({ x:px, y:py, color:m[1]?.trim()||'red', label: m.slice(2).join(',').trim() });
          }
        } else {
          const pieces = line.split(',');
          const expr = pieces[0].trim().replace(/^y\s*=\s*/i,'');
          if (expr) functions.push({ expr, color: pieces[1]?.trim()||'blue', label: pieces.slice(2).join(',').trim() });
        }
      }

      let [xMin,xMax] = xRange, [yMin,yMax] = yRange;
      if (!isFinite(xMin)||!isFinite(xMax)||xMin===xMax) { xMin=-5; xMax=5; }
      if (!isFinite(yMin)||!isFinite(yMax)||yMin===yMax) { yMin=-5; yMax=5; }
      let totalX = xMax-xMin, totalY = yMax-yMin;

      if (hUnits !== undefined && wUnits !== undefined) {
        if (axisXUnits === undefined || isNaN(axisXUnits)) axisXUnits = (0-yMin)/(yMax-yMin)*hUnits;
        if (axisYUnits === undefined || isNaN(axisYUnits)) axisYUnits = (0-xMin)/(xMax-xMin)*wUnits;
        xMin = -axisYUnits; xMax = wUnits - axisYUnits;
        yMin = -axisXUnits; yMax = hUnits - axisXUnits;
        totalX = xMax-xMin; totalY = yMax-yMin;
      }

      const outputContainer = document.getElementById('output');
      let outerWidth = Math.max(300, (outputContainer?.clientWidth || 400) * 0.8);
      const marginLeft=40, marginRight=20, marginTop=20, marginBottom=40;
      const availableWidth = outerWidth - marginLeft - marginRight;
      const ratio = (hUnits!==undefined && wUnits!==undefined) ? (hUnits/wUnits) : (totalY/totalX);
      const availableHeight = availableWidth * ratio;
      const outerHeight = availableHeight + marginTop + marginBottom;

      const unitX = availableWidth / totalX;
      const unitY = availableHeight / totalY;

      let axisXVal, axisYVal;
      if (hUnits!==undefined && wUnits!==undefined) {
        axisXVal = yMin + (axisXUnits / (hUnits||1)) * totalY;
        axisYVal = xMin + (axisYUnits / (wUnits||1)) * totalX;
      } else { axisXVal = 0; axisYVal = 0; }

      const pyAxis = marginTop + ((yMax - axisXVal) / totalY) * availableHeight;
      const pxAxis = marginLeft + ((axisYVal - xMin) / totalX) * availableWidth;

      const svg = [];
      svg.push(`<svg width="${outerWidth}" height="${outerHeight}" viewBox="0 0 ${outerWidth} ${outerHeight}" xmlns="http://www.w3.org/2000/svg">`);

      // grid (1刻み)
      if (gridColor) {
        for (let xi=Math.ceil(xMin); xi<=xMax; xi++) {
          const px = marginLeft + ((xi-xMin)/totalX)*availableWidth;
          svg.push(`<line x1="${px}" y1="${marginTop}" x2="${px}" y2="${marginTop+availableHeight}" stroke="${gridColor}" stroke-width="0.5"/>`);
        }
        for (let yi=Math.ceil(yMin); yi<=yMax; yi++) {
          const py = marginTop + ((yMax-yi)/totalY)*availableHeight;
          svg.push(`<line x1="${marginLeft}" y1="${py}" x2="${marginLeft+availableWidth}" y2="${py}" stroke="${gridColor}" stroke-width="0.5"/>`);
        }
      }
      // grid (scales)
      if (gridScale && gridScale>0) {
        for (let xv=Math.ceil(xMin/gridScale)*gridScale; xv<=xMax; xv+=gridScale) {
          const px = marginLeft + ((xv-xMin)/totalX)*availableWidth;
          svg.push(`<line x1="${px}" y1="${marginTop}" x2="${px}" y2="${marginTop+availableHeight}" stroke="${gridColor}" stroke-width="1"/>`);
        }
        for (let yv=Math.ceil(yMin/gridScale)*gridScale; yv<=yMax; yv+=gridScale) {
          const py = marginTop + ((yMax-yv)/totalY)*availableHeight;
          svg.push(`<line x1="${marginLeft}" y1="${py}" x2="${marginLeft+availableWidth}" y2="${py}" stroke="${gridColor}" stroke-width="1"/>`);
        }
      }
      // axes
      if (axisXVal>=yMin && axisXVal<=yMax) svg.push(`<line x1="${marginLeft}" y1="${pyAxis}" x2="${marginLeft+availableWidth}" y2="${pyAxis}" stroke="black" stroke-width="1"/>`);
      if (axisYVal>=xMin && axisYVal<=xMax) svg.push(`<line x1="${pxAxis}" y1="${marginTop}" x2="${pxAxis}" y2="${marginTop+availableHeight}" stroke="black" stroke-width="1"/>`);

      // axis labels
      const xLabelX = marginLeft + availableWidth + 5;
      const xLabelY = (axisXVal>=yMin && axisXVal<=yMax) ? (pyAxis+15) : (marginTop+availableHeight+15);
      const yLabelX = (axisYVal>=xMin && axisYVal<=xMax) ? (pxAxis-15) : (marginLeft-20);
      const yLabelY = marginTop - 5;
      svg.push(`<text x="${xLabelX}" y="${xLabelY}" font-size="12" fill="black">x</text>`);
      svg.push(`<text x="${yLabelX}" y="${yLabelY}" font-size="12" fill="black">y</text>`);

      // ticks（整数）
      const tick = 4;
      if (axisXVal>=yMin && axisXVal<=yMax) {
        for (let xi=Math.ceil(xMin); xi<=Math.floor(xMax); xi++) {
          const px = marginLeft + ((xi-xMin)/totalX)*availableWidth;
          svg.push(`<line x1="${px}" y1="${pyAxis-tick}" x2="${px}" y2="${pyAxis+tick}" stroke="black" stroke-width="0.5"/>`);
        }
      }
      if (axisYVal>=xMin && axisYVal<=xMax) {
        for (let yi=Math.ceil(yMin); yi<=Math.floor(yMax); yi++) {
          const py = marginTop + ((yMax-yi)/totalY)*availableHeight;
          svg.push(`<line x1="${pxAxis-tick}" y1="${py}" x2="${pxAxis+tick}" y2="${py}" stroke="black" stroke-width="0.5"/>`);
        }
      }

      // helpers
      function latexToJs(expr) {
        let js = expr;
        js = js.replace(/\\frac\s*{([^}]*)}\s*{([^}]*)}/g, '($1)/($2)');
        js = js.replace(/\^/g, '**');
        js = js.replace(/{/g,'(').replace(/}/g,')');
        js = js.replace(/(\d)([a-zA-Z])/g,'$1*$2')
               .replace(/([a-zA-Z])(\d)/g,'$1*$2')
               .replace(/([a-zA-Z])\(/g,'$1*(')
               .replace(/\)([a-zA-Z])/g,')*$1');
        return js;
      }
      function compileFunction(jsExpr) {
        if (!/^[-+*/().\d\sxa-zA-Z*]+$/.test(jsExpr)) return null;
        try { return new Function('x', `return ${jsExpr};`); }
        catch { return null; }
      }

      // function plots
      const steps = 200;
      for (const fn of functions) {
        const f = compileFunction(latexToJs(fn.expr)); if (!f) continue;
        let seg = [], prevValid=false, prevY=null, maxD=-Infinity, labelPx, labelPy;
        for (let i=0;i<=steps;i++){
          const x = xMin + (xMax-xMin)*i/steps;
          let y = Number.NaN;
          try { y = f(x); } catch {}
          const valid = isFinite(y) && y>=yMin && y<=yMax;
          let jump=false;
          if (valid && prevValid) {
            const diff = Math.abs(y - prevY);
            if (diff > (yMax-yMin)*2) jump=true;
          }
          if (!valid || jump) {
            if (seg.length>1) svg.push(`<polyline fill="none" stroke="${fn.color||'blue'}" stroke-width="1.5" points="${seg.join(' ')}"/>`);
            seg=[]; prevValid=false; prevY=null; continue;
          }
          const px = marginLeft + ((x-xMin)/totalX)*availableWidth;
          const py = marginTop + ((yMax-y)/totalY)*availableHeight;
          seg.push(`${px.toFixed(3)},${py.toFixed(3)}`);
          const d2 = x*x + y*y;
          if (d2>maxD){ maxD=d2; labelPx=px; labelPy=py; }
          prevValid=true; prevY=y;
        }
        if (seg.length>1) svg.push(`<polyline fill="none" stroke="${fn.color||'blue'}" stroke-width="1.5" points="${seg.join(' ')}"/>`);
        fn._labelPx = labelPx; fn._labelPy = labelPy;
      }

      // points
      for (const pt of points) {
        if (pt.x<xMin||pt.x>xMax||pt.y<yMin||pt.y>yMax) continue;
        const px = marginLeft + ((pt.x-xMin)/totalX)*availableWidth;
        const py = marginTop + ((yMax-pt.y)/totalY)*availableHeight;
        svg.push(`<circle cx="${px}" cy="${py}" r="3" fill="${pt.color||'red'}"/>`);
      }

      svg.push(`</svg>`);

      // label overlay
      let labelDivs = '';
      const labelBoxes = [];
      function placeLabel(xpx, ypx, text) {
        if (!text) return;
        const safe = window.DOMPurify?.sanitize ? DOMPurify.sanitize(text) : text;
        const w = safe.length*8+4, h=16;
        let lx = xpx+5, ly= ypx-5-h;
        if (ly < marginTop) ly = ypx + 5;
        if (lx + w > marginLeft+availableWidth) lx = xpx - w - 5;
        if (lx < marginLeft) lx = marginLeft;
        function overlaps(b){ return !(lx+w<b.x || lx>b.x+b.w || ly+h<b.y || ly>b.y+b.h); }
        let tries=0;
        while (labelBoxes.some(overlaps) && tries<10) { ly += h+4; if (ly+h>marginTop+availableHeight) ly = ypx-(h+4); tries++; }
        labelBoxes.push({x:lx,y:ly,w,h});
        labelDivs += `<div style="position:absolute;left:${lx}px;top:${ly}px;font-size:12px;white-space:nowrap;">${safe}</div>`;
      }
      for (const fn of functions) if (fn.label && fn._labelPx!==undefined) placeLabel(fn._labelPx, fn._labelPy, fn.label);

      for (const pt of points) {
        if (pt.x<xMin||pt.x>xMax||pt.y<yMin||pt.y>yMax) continue;
        const px = marginLeft + ((pt.x-xMin)/totalX)*availableWidth;
        const py = marginTop + ((yMax-pt.y)/totalY)*availableHeight;
        if (pt.label) placeLabel(px, py, pt.label);
      }

      return `<div style="position:relative;width:${outerWidth}px;height:${outerHeight}px">${svg.join('')}${labelDivs}</div>`;
    }

    // TikZJax 実行ヘルパー
    function runTikz(container){
      try{
        if (window.tikzjax && typeof window.tikzjax.render === 'function'){
          window.tikzjax.render(container || document);
        } else {
          const s = document.createElement('script');
          s.src = `https://tikzjax.com/v1/tikzjax.js?cb=${Date.now()}`;
          document.head.appendChild(s);
        }
      }catch(e){ console.warn('TikZJax fallback error', e); }
    }

    // --- メイン ---
    async function renderContent() {
      const input = document.getElementById('tikz-input').value;
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');
      statusEl.textContent = 'レンダリング中...';

      try {
        const segments = splitIntoSegments(input);

        // 1) TikZ と graf を先に解決（TikZはサーバ→失敗時フォールバック）
        const tikzPieces = []; // { html?:string, fallback?:boolean, code?:string }
        const grafSvgs = [];

        for (const seg of segments) {
          if (seg.type === 'tikz') {
            const tikzPatched = tikzQuoteShim(seg.code);
            try {
              const response = await fetch('/render', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tikz: tikzPatched })
              });
              if (!response.ok) throw new Error('server');
              const data = await response.json();
              tikzPieces.push({ html: data.svg || '<p style="color:red">TikZ レンダリング失敗</p>', fallback: false });
            } catch {
              tikzPieces.push({ fallback: true, code: tikzPatched });
            }
          } else if (seg.type === 'graf') {
            try { grafSvgs.push(renderGraf(seg.code)); }
            catch (e) { console.error('Graf render error', e); grafSvgs.push('<p style="color:red">グラフの描画に失敗しました</p>'); }
          }
        }

        // 2) 出力HTMLを組み立て（TikZフォールバックはプレースホルダ）
        let tikzIndex = 0, grafIndex = 0, html = '';
        for (const seg of segments) {
          if (seg.type === 'tikz') {
            const piece = tikzPieces[tikzIndex++] || {};
            if (piece.fallback) {
              html += `<div class="segment tikz-fallback" data-idx="${tikzIndex-1}"></div>`;
            } else {
              html += `<div class="segment">${piece.html || ''}</div>`;
            }
          } else if (seg.type === 'graf') {
            const svg = grafSvgs[grafIndex++] || '';
            html += `<div class="segment">${svg}</div>`;
          } else {
            // Markdown と \[...\] の共存処理
            let htmlSegment = '';
            try {
              const raw = seg.content || '';
              if (window.marked && typeof marked.parse === 'function') {
                const regex = /\\\[[\s\S]*?\\\]/g;
                let lastIndex = 0, m;
                while ((m = regex.exec(raw)) !== null) {
                  const pre = raw.slice(lastIndex, m.index);
                  if (pre) {
                    let parsed = marked.parse(pre);
                    if (window.DOMPurify?.sanitize) parsed = DOMPurify.sanitize(parsed);
                    htmlSegment += parsed;
                  }
                  const escapedMath = escapeForHtml(m[0]);
                  htmlSegment += `<div>${escapedMath}</div>`;
                  lastIndex = regex.lastIndex;
                }
                const rest = raw.slice(lastIndex);
                if (rest) {
                  let parsed = marked.parse(rest);
                  if (window.DOMPurify?.sanitize) parsed = DOMPurify.sanitize(parsed);
                  htmlSegment += parsed;
                }
              } else {
                htmlSegment = escapeForHtml(raw);
              }
            } catch (e) {
              console.error('Markdown parse error', e);
              htmlSegment = escapeForHtml(seg.content);
            }
            html += `<div class="segment">${htmlSegment}</div>`;
          }
        }
        outputEl.innerHTML = html;

        // 3) フォールバック TikZ を安全に挿入（script 要素を生成）
        const phs = outputEl.querySelectorAll('.tikz-fallback');
        phs.forEach(ph => {
          const idx = Number(ph.getAttribute('data-idx'));
          const piece = (tikzPieces[idx] || {});
          if (!piece.fallback) return;
          const sc = document.createElement('script');
          sc.type = 'text/tikz';
          sc.textContent = piece.code || '';
          ph.appendChild(sc);
        });

        // 4) 数式レンダリング
        if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
          await MathJax.typesetPromise([outputEl]);
        }

        // 5) TikZJax フォールバックがあれば実行
        if (phs.length) runTikz(outputEl);

      } catch (err) {
        console.error(err);
        outputEl.innerHTML = '<p style="color:red">エラーが発生しました: ' + err.message + '</p>';
      } finally {
        statusEl.textContent = '';
      }
    }

    document.getElementById('render-btn').addEventListener('click', renderContent);
  </script>
</body>
</html>
