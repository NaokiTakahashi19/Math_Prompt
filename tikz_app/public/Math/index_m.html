<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Markdown + LaTeX Preview (Local)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{margin:0;display:flex;height:100vh;font-family:-apple-system,Roboto,Arial,sans-serif;background:#f7f8fa;color:#222}
    textarea{width:50%;height:100%;padding:15px;font-family:"JetBrains Mono",monospace;font-size:14px;border:0;outline:none;resize:none;border-right:1px solid #ccc;background:#fff}
    #out{width:50%;padding:20px;overflow:auto;background:#fff}
    header{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:.75rem;background:#222;color:#fff;font-size:14px;padding:0 12px}
    .wrap{display:flex;flex:1;height:100%}
    @media(max-width:900px){body{flex-direction:column}textarea,#out{width:100%;height:50%}}
  </style>

  <!-- Marked.js（Markdownパーサ） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- MathJax v3 -->
  <script>
    window.MathJax = {
      tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$','$$']]},
      svg: {fontCache: 'global'}
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
</head>
<body>
  <header>Markdown + LaTeX プレビュー（ローカル対応可）</header>
  <div class="wrap">
    <textarea id="src" placeholder="Markdown と LaTeX を混ぜて書けます。

# 例
数式：
\[
E = mc^2
\]

インラインで $a^2 + b^2 = c^2$ もOK。
**太字**, *斜体*, リスト, コードもOK。
"></textarea>
    <div id="out"></div>
  </div>

  <script>
    const src = document.getElementById('src');
    const out = document.getElementById('out');

    function render() {
      // MarkdownをHTMLに変換
      const html = marked.parse(src.value, {breaks:true});
      out.innerHTML = html;
      // 数式レンダリング
      if (window.MathJax && MathJax.typesetPromise)
        MathJax.typesetPromise([out]);
    }
    src.addEventListener('input', ()=> {
      localStorage.setItem('mdlatex_src', src.value);
      render();
    });

    // 前回保存した内容を復元
    src.value = localStorage.getItem('mdlatex_src') || src.placeholder;
    render();
  </script>
</body>
</html>
