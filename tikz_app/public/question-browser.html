<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作問結果ブラウザ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #fff;
      --line: #d8dde5;
      --text: #17202a;
      --muted: #5c6673;
      --accent: #1967d2;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0 0 3px;
      font-size: 21px;
      line-height: 1.25;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }

    .title-row h1 {
      margin-bottom: 0;
    }

    .app-updated {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      padding: 2px 8px;
      white-space: nowrap;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    a,
    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 6px 12px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.danger {
      border-color: #d93025;
      color: #b3261e;
      font-weight: 700;
    }

    button.danger:hover:not(:disabled) {
      background: #fce8e6;
    }

    input,
    select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 6px 8px;
      font: inherit;
    }

    main {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
    }

    aside {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .filters {
      min-width: 0;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .filter-row {
      min-width: 0;
      display: flex;
      gap: 8px;
    }

    .filters select {
      width: 100%;
      min-width: 0;
    }

    .filter-row input {
      flex: 1;
      min-width: 0;
    }

    .filter-row button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    #summary {
      padding: 8px 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    #file-list {
      min-height: 0;
      overflow: auto;
    }

    .file-button {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      text-align: left;
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      min-height: 58px;
    }

    .file-button:hover,
    .file-button.active {
      background: #eef4ff;
    }

    .file-name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .file-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    section.viewer {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .viewer-head {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #selected-title {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    #status {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    #status.error { color: var(--danger); }

    #header-export-status {
      color: var(--muted);
      font-size: 13px;
      min-width: 12em;
    }

    #output {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background: #fff;
      font-size: 14px;
      line-height: 1.8;
    }

    #output table {
      border-collapse: collapse;
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0.75em 0 1em;
      overflow-x: auto;
      font-size: 0.95em;
    }

    #output th,
    #output td {
      min-width: 2.2em;
      padding: 4px 10px;
      border: 1px solid #999;
      text-align: right;
      white-space: nowrap;
    }

    #output th {
      background: #f7f7f7;
      text-align: center;
    }

    body.large-output #output {
      font-size: 16.8px;
      line-height: 1.9;
    }

    #raw-editor {
      width: 100%;
      min-height: 100%;
      border: 0;
      outline: none;
      resize: none;
      padding: 18px;
      background: #fff;
      color: var(--text);
      font: 14px/1.7 "Courier New", "Yu Gothic", monospace;
      white-space: pre;
    }

    .empty {
      color: var(--muted);
    }

    .segment > svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 12px auto;
    }

    mjx-container[jax="SVG"][display="true"] {
      display: block;
      text-align: center;
      margin: 1em 0;
    }

    mjx-container[jax="SVG"]:not([display="true"]) {
      display: inline-block;
      vertical-align: -0.2em;
      margin: 0 .1em;
    }

    @media (max-width: 840px) {
      html { overflow: auto; }
      body { height: auto; min-height: 100vh; overflow: auto; }
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 52vh; }
      section.viewer { min-height: 70vh; }
    }
  </style>
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/bbox'] },
      tex: {
        packages: {'[+]': ['bbox']},
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true,
        processEnvironments: true,
        macros: {
          hlblue: ['\\bbox[2px,lightskyblue]{#1}', 1],
          hlpink: ['\\bbox[2px,lightpink]{#1}', 1],
          hlgreen: ['\\bbox[2px,lightgreen]{#1}', 1]
        }
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
  <script src="/app-meta.js" defer></script>
</head>
<body>
  <header>
    <div>
      <div class="title-row">
        <h1>作問結果ブラウザ</h1>
        <span class="app-updated" data-app-updated>更新確認中</span>
      </div>
      <p>Math_Question フォルダ内の生成結果をすばやく確認できます。</p>
    </div>
    <nav>
      <a href="/">編集画面</a>
      <a href="/questions">問題生成</a>
      <button id="export-visible-word-btn" type="button">表示中をWord出力</button>
      <span id="header-export-status"></span>
    </nav>
  </header>

  <main>
    <aside>
      <div class="filters">
        <div class="filter-row">
          <button id="refresh-btn" type="button">更新</button>
          <input id="search-input" type="search" placeholder="ファイル名・学習項目で検索" />
        </div>
        <select id="grade-filter">
          <option value="">すべての学年</option>
          <option value="1">中1</option>
          <option value="2">中2</option>
          <option value="3">中3</option>
        </select>
        <select id="area-filter">
          <option value="">すべての領域</option>
        </select>
        <select id="unit-filter">
          <option value="">すべての単元</option>
        </select>
        <select id="item-filter">
          <option value="">すべての項目</option>
        </select>
      </div>
      <div id="summary">読み込み中...</div>
      <div id="file-list"></div>
    </aside>

    <section class="viewer">
      <div class="viewer-head">
        <div>
          <div id="selected-title">未選択</div>
          <div id="status"></div>
        </div>
        <div class="viewer-actions">
          <button id="font-size-toggle" type="button" aria-pressed="false">文字大</button>
          <button id="edit-file-btn" type="button" disabled>編集</button>
          <button id="save-edit-btn" class="primary" type="button" hidden>保存</button>
          <button id="cancel-edit-btn" type="button" hidden>キャンセル</button>
          <button id="copy-name-btn" type="button" disabled>ファイル名コピー</button>
          <button id="rename-file-btn" type="button" disabled>リネーム</button>
          <button id="delete-file-btn" class="danger" type="button" disabled>削除</button>
        </div>
      </div>
      <div id="output"><p class="empty">左の一覧から作問結果を選択してください。</p></div>
    </section>
  </main>

  <script>
    const state = {
      files: [],
      filtered: [],
      selectedName: '',
      selectedContent: '',
      editing: false
    };

    const fileListEl = document.getElementById('file-list');
    const summaryEl = document.getElementById('summary');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('selected-title');
    const searchInput = document.getElementById('search-input');
    const gradeFilter = document.getElementById('grade-filter');
    const areaFilter = document.getElementById('area-filter');
    const unitFilter = document.getElementById('unit-filter');
    const itemFilter = document.getElementById('item-filter');
    const editFileBtn = document.getElementById('edit-file-btn');
    const saveEditBtn = document.getElementById('save-edit-btn');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const copyNameBtn = document.getElementById('copy-name-btn');
    const renameFileBtn = document.getElementById('rename-file-btn');
    const deleteFileBtn = document.getElementById('delete-file-btn');
    const fontSizeToggleBtn = document.getElementById('font-size-toggle');
    const exportVisibleWordBtn = document.getElementById('export-visible-word-btn');
    const headerExportStatusEl = document.getElementById('header-export-status');
    const largeOutputStorageKey = 'questionBrowserLargeOutput';
    let keyboardNavigationToken = 0;
    let wordExportFramePromise = null;
    let wordExportRunning = false;

    function setLargeOutput(enabled) {
      document.body.classList.toggle('large-output', enabled);
      localStorage.setItem(largeOutputStorageKey, enabled ? '1' : '0');
      if (!fontSizeToggleBtn) return;
      fontSizeToggleBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      fontSizeToggleBtn.textContent = enabled ? '文字大 ON' : '文字大';
    }

    function initLargeOutputToggle() {
      setLargeOutput(localStorage.getItem(largeOutputStorageKey) === '1');
      if (!fontSizeToggleBtn) return;
      fontSizeToggleBtn.addEventListener('click', () => {
        setLargeOutput(!document.body.classList.contains('large-output'));
      });
    }

    function escapeForHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function questionFileBase(fileName) {
      return String(fileName || '').replace(/\.txt$/i, '');
    }

    function sourceStemFromQuestionFileName(fileName) {
      const stem = questionFileBase(fileName.split('/').pop());
      const match = stem.match(/^(m-jh[123]-[A-Z]-\d{2}-\d{2}[A-Za-z]*)(?:ｰ|-)(\d+)$/);
      return match ? match[1] : stem;
    }

    function promptStemFromQuestionFileName(fileName) {
      const stem = questionFileBase(String(fileName || '').split('/').pop());
      const match = stem.match(/^(m-jh[123]-[A-Z]-\d{2}-\d{2}[A-Za-z]*)/);
      return match ? match[1] : sourceStemFromQuestionFileName(fileName);
    }

    function learningItemKeyFromQuestionFileName(fileName) {
      const stem = sourceStemFromQuestionFileName(fileName);
      const match = stem.match(/^(m-jh[123]-[A-Z]-\d{2}-\d{2})[A-Za-z]*$/);
      return match ? match[1] : stem;
    }

    function gradeFromQuestionFileName(fileName) {
      return String(fileName || '').match(/m-jh([123])-/)?.[1] || '';
    }

    function splitPromptTitle(title) {
      const parts = String(title || '').split(/\s*[―-]\s*/);
      return {
        unit: (parts[0] || '').trim(),
        item: (parts.slice(1).join(' ― ') || '').trim()
      };
    }

    function areaLabelFromCode(code) {
      const areaCode = String(code || '').match(/^[123]-([A-Z])-/)?.[1] || '';
      const labels = {
        A: 'A 数と式',
        B: 'B 図形',
        C: 'C 関数',
        D: 'D データの活用'
      };
      return { areaCode, areaLabel: labels[areaCode] || (areaCode ? `${areaCode} 領域` : '') };
    }

    function codeParts(code) {
      const match = String(code || '').match(/^([123])-([A-Z])-(\d{2})-(\d{2})/);
      return {
        unitCode: match ? match[3] : '',
        itemCode: match ? match[4] : ''
      };
    }

    function buildPromptMetaByStem(promptFiles) {
      const meta = new Map();
      for (const prompt of promptFiles || []) {
        const stem = questionFileBase(prompt.name);
        const { unit, item } = splitPromptTitle(prompt.title);
        const { areaCode, areaLabel } = areaLabelFromCode(prompt.code);
        const { unitCode, itemCode } = codeParts(prompt.code);
        meta.set(stem, {
          code: prompt.code || '',
          title: prompt.title || '',
          level: prompt.level || '',
          areaCode,
          areaLabel,
          unitCode,
          itemCode,
          unit,
          item
        });
      }
      return meta;
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '読み込みに失敗しました');
      return data;
    }

    function setHeaderExportStatus(message, kind = '') {
      headerExportStatusEl.textContent = message || '';
      headerExportStatusEl.style.color = kind === 'error' ? 'var(--danger)' : kind === 'ok' ? '#137333' : 'var(--muted)';
    }

    function downloadBlob(fileName, mimeType, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function ensureWordExportFrame() {
      if (wordExportFramePromise) return wordExportFramePromise;

      wordExportFramePromise = new Promise((resolve, reject) => {
        const iframe = document.createElement('iframe');
        iframe.src = `/questions?word-export=${Date.now()}`;
        iframe.hidden = true;
        iframe.style.display = 'none';
        iframe.onload = async () => {
          try {
            const win = iframe.contentWindow;
            const startedAt = Date.now();
            while (!(win?.questionWordExport && typeof win.questionWordExport.buildDocxBlob === 'function')) {
              if (Date.now() - startedAt > 10000) {
                throw new Error('Word出力エンジンの読み込みがタイムアウトしました');
              }
              await new Promise(resolveWait => setTimeout(resolveWait, 100));
            }
            if (!await win.questionWordExport.ready()) {
              throw new Error('Word出力ライブラリを読み込めませんでした');
            }
            resolve(win);
          } catch (err) {
            reject(err);
          }
        };
        iframe.onerror = () => reject(new Error('Word出力エンジンを読み込めませんでした'));
        document.body.appendChild(iframe);
      });

      return wordExportFramePromise;
    }

    function zipDateParts(date = new Date()) {
      const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { time, date: dosDate };
    }

    let crcTable = null;
    function crc32(bytes) {
      if (!crcTable) {
        crcTable = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let value = i;
          for (let bit = 0; bit < 8; bit++) {
            value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
          }
          crcTable[i] = value >>> 0;
        }
      }

      let crc = 0xffffffff;
      for (const byte of bytes) {
        crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function zipHeaderBytes(values) {
      const bytes = [];
      const u16 = value => {
        bytes.push(value & 0xff, (value >>> 8) & 0xff);
      };
      const u32 = value => {
        bytes.push(value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff);
      };

      for (const item of values) {
        if (item.type === 'u16') u16(item.value);
        else if (item.type === 'u32') u32(item.value);
        else bytes.push(...item);
      }
      return new Uint8Array(bytes);
    }

    async function createZipBlob(entries) {
      const encoder = new TextEncoder();
      const parts = [];
      const centralParts = [];
      const { time, date } = zipDateParts();
      let offset = 0;

      for (const entry of entries) {
        const nameBytes = encoder.encode(entry.name);
        const data = new Uint8Array(await entry.blob.arrayBuffer());
        const crc = crc32(data);

        const localHeader = zipHeaderBytes([
          { type: 'u32', value: 0x04034b50 },
          { type: 'u16', value: 20 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: time },
          { type: 'u16', value: date },
          { type: 'u32', value: crc },
          { type: 'u32', value: data.byteLength },
          { type: 'u32', value: data.byteLength },
          { type: 'u16', value: nameBytes.byteLength },
          { type: 'u16', value: 0 },
          nameBytes
        ]);
        parts.push(localHeader, data);

        const centralHeader = zipHeaderBytes([
          { type: 'u32', value: 0x02014b50 },
          { type: 'u16', value: 20 },
          { type: 'u16', value: 20 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: time },
          { type: 'u16', value: date },
          { type: 'u32', value: crc },
          { type: 'u32', value: data.byteLength },
          { type: 'u32', value: data.byteLength },
          { type: 'u16', value: nameBytes.byteLength },
          { type: 'u16', value: 0 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: 0 },
          { type: 'u16', value: 0 },
          { type: 'u32', value: 0 },
          { type: 'u32', value: offset },
          nameBytes
        ]);
        centralParts.push(centralHeader);
        offset += localHeader.byteLength + data.byteLength;
      }

      const centralOffset = offset;
      const centralSize = centralParts.reduce((sum, part) => sum + part.byteLength, 0);
      const endRecord = zipHeaderBytes([
        { type: 'u32', value: 0x06054b50 },
        { type: 'u16', value: 0 },
        { type: 'u16', value: 0 },
        { type: 'u16', value: entries.length },
        { type: 'u16', value: entries.length },
        { type: 'u32', value: centralSize },
        { type: 'u32', value: centralOffset },
        { type: 'u16', value: 0 }
      ]);

      return new Blob([...parts, ...centralParts, endRecord], { type: 'application/zip' });
    }

    function splitIntoSegments(text) {
      const segments = [];
      let pos = 0;
      while (pos < text.length) {
        const pTikz = text.indexOf('\\begin{tikzpicture}', pos);
        if (pTikz === -1) break;
        if (pTikz > pos) segments.push({ type: 'text', content: text.slice(pos, pTikz) });
        const endIndex = text.indexOf('\\end{tikzpicture}', pTikz);
        if (endIndex === -1) {
          segments.push({ type: 'text', content: text.slice(pTikz) });
          pos = text.length;
          break;
        }
        segments.push({ type: 'tikz', code: text.slice(pTikz, endIndex + '\\end{tikzpicture}'.length) });
        pos = endIndex + '\\end{tikzpicture}'.length;
      }
      if (pos < text.length) segments.push({ type: 'text', content: text.slice(pos) });
      return segments;
    }

    function tikzQuoteShim(code) {
      code = code.replace(/\\usetikzlibrary\{([^}]*)\}/g, (match, inner) => {
        if (!/\bquotes\b/.test(inner)) return match;
        const rest = inner.split(',').map(part => part.trim()).filter(part => part && part !== 'quotes');
        return rest.length ? `\\usetikzlibrary{${rest.join(',')}}` : '% quotes removed';
      });

      const re = /(--|to)\s*\[\s*(?:"([^"]+)"|'([^']+)')\s*((?:\s*,\s*[^,\]\r\n]+)*)\s*\]/g;
      return code.replace(re, (match, connector, dquoted, squoted, optRaw) => {
        const label = (dquoted ?? squoted ?? '').replace(/\\/g, '\\\\');
        let opts = (optRaw || '').trim().replace(/^\s*,/, '');
        const hasPos = /(?:^|,)\s*(pos\s*=|near\s*(?:start|end)|midway)\b/.test(opts);
        if (!hasPos) opts = opts ? `midway, ${opts}` : 'midway';
        const hasSide = /\b(above|below|left|right)\b/.test(opts);
        const hasAutoOrSwap = /\b(auto|swap)\b/.test(opts);
        if (!hasSide && !hasAutoOrSwap) opts = `${opts}, auto`;
        return `${connector} node[${opts}] {${label}}`;
      });
    }

    async function waitForMathJaxReady(timeoutMs = 5000) {
      const startedAt = Date.now();
      while (!(window.MathJax && typeof MathJax.typesetPromise === 'function')) {
        if (Date.now() - startedAt > timeoutMs) return false;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return true;
    }

    async function renderContent(content) {
      if (window.marked?.setOptions) {
        marked.setOptions({ gfm: true, breaks: true });
      }

      function normalizeMarkdownTables(text) {
        const lines = String(text || '').split('\n');
        const normalized = [];
        const tableRow = /^\s*\|.*\|\s*$/;
        const tableDivider = /^\s*\|(?:\s*:?-{3,}:?\s*\|)+\s*$/;

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const nextLine = lines[index + 1] || '';
          if (
            tableRow.test(line) &&
            tableDivider.test(nextLine) &&
            normalized.length &&
            normalized[normalized.length - 1].trim()
          ) {
            normalized.push('');
          }
          normalized.push(line);
        }

        return normalized.join('\n');
      }

      function renderMarkdownWithMath(raw) {
        raw = normalizeMarkdownTables(raw);
        if (!window.marked || typeof marked.parse !== 'function') {
          return escapeForHtml(raw).replace(/\n/g, '<br>');
        }

        function parseMarkdownPreservingInlineMath(text) {
          const inlineMath = [];
          const tokenized = text.replace(/\\\([\s\S]*?\\\)/g, match => {
            const token = `MATHINLINEPLACEHOLDER${inlineMath.length}X`;
            inlineMath.push({ token, math: match });
            return token;
          });

          let parsed = marked.parse(tokenized);
          if (window.DOMPurify?.sanitize) parsed = DOMPurify.sanitize(parsed);

          for (const item of inlineMath) {
            parsed = parsed.replaceAll(item.token, `<span>${escapeForHtml(item.math)}</span>`);
          }
          return parsed;
        }

        const mathRegex = /\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$/g;
        let htmlSegment = '';
        let lastIndex = 0;
        let match;

        while ((match = mathRegex.exec(raw)) !== null) {
          const beforeMath = raw.slice(lastIndex, match.index);
          if (beforeMath) {
            htmlSegment += parseMarkdownPreservingInlineMath(beforeMath);
          }

          htmlSegment += `<div>${escapeForHtml(match[0])}</div>`;
          lastIndex = mathRegex.lastIndex;
        }

        const rest = raw.slice(lastIndex);
        if (rest) {
          htmlSegment += parseMarkdownPreservingInlineMath(rest);
        }

        return htmlSegment;
      }

      const segments = splitIntoSegments(content || '');
      const tikzPieces = [];
      for (const segment of segments) {
        if (segment.type !== 'tikz') continue;
        try {
          const response = await fetch('/render', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tikz: tikzQuoteShim(segment.code) })
          });
          if (!response.ok) throw new Error('TikZ render failed');
          const data = await response.json();
          tikzPieces.push(data.svg || '<p style="color:red">TikZ レンダリング失敗</p>');
        } catch (err) {
          console.error(err);
          tikzPieces.push(`<pre>${escapeForHtml(segment.code)}</pre>`);
        }
      }

      let tikzIndex = 0;
      let html = '';
      for (const segment of segments) {
        if (segment.type === 'tikz') {
          html += `<div class="segment">${tikzPieces[tikzIndex++] || ''}</div>`;
          continue;
        }

        const raw = segment.content || '';
        html += `<div class="segment">${renderMarkdownWithMath(raw)}</div>`;
      }

      outputEl.innerHTML = html || '<p class="empty">内容がありません。</p>';
      if (await waitForMathJaxReady()) {
        await MathJax.typesetPromise([outputEl]);
      }
    }

    function populateSelect(selectEl, defaultLabel, values, selectedValue) {
      selectEl.innerHTML = `<option value="">${escapeForHtml(defaultLabel)}</option>`;
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value.value;
        option.textContent = value.label;
        selectEl.appendChild(option);
      }
      if (selectedValue && values.some(value => value.value === selectedValue)) {
        selectEl.value = selectedValue;
      }
    }

    function uniqueOptions(files, valueKey, labelKey = valueKey, sortKey = labelKey) {
      const seen = new Map();
      for (const file of files) {
        const value = file[valueKey];
        if (!value) continue;
        const next = {
          value,
          label: file[labelKey] || value,
          sort: file[sortKey] || file[labelKey] || value
        };
        const current = seen.get(value);
        if (
          !current ||
          String(next.sort).localeCompare(String(current.sort), 'ja', { numeric: true }) < 0
        ) {
          seen.set(value, next);
        }
      }
      return Array.from(seen.values())
        .sort((a, b) => String(a.sort).localeCompare(String(b.sort), 'ja', { numeric: true }) || a.label.localeCompare(b.label, 'ja', { numeric: true }))
        .map(({ value, label }) => ({ value, label }));
    }

    function populateFilterOptions() {
      const grade = gradeFilter.value;
      const area = areaFilter.value;
      const unit = unitFilter.value;
      const item = itemFilter.value;

      const gradeScoped = grade ? state.files.filter(file => file.grade === grade) : state.files;
      populateSelect(areaFilter, 'すべての領域', uniqueOptions(gradeScoped, 'areaCode', 'areaLabel'), area);

      const areaScoped = areaFilter.value ? gradeScoped.filter(file => file.areaCode === areaFilter.value) : gradeScoped;
      populateSelect(unitFilter, 'すべての単元', uniqueOptions(areaScoped, 'unit', 'unit', 'code'), unit);

      const unitScoped = unitFilter.value ? areaScoped.filter(file => file.unit === unitFilter.value) : areaScoped;
      populateSelect(itemFilter, 'すべての項目', uniqueOptions(unitScoped, 'item', 'item', 'code'), item);
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const grade = gradeFilter.value;
      const area = areaFilter.value;
      const unit = unitFilter.value;
      const item = itemFilter.value;
      state.filtered = state.files.filter(file => {
        if (grade && file.grade !== grade) return false;
        if (area && file.areaCode !== area) return false;
        if (unit && file.unit !== unit) return false;
        if (item && file.item !== item) return false;
        if (!query) return true;
        return [file.name, file.label, file.sourceStem, file.learningItemKey, file.gradeLabel, file.areaLabel, file.unit, file.item].join(' ').toLowerCase().includes(query);
      });
      renderFileList();
    }

    function renderFileList() {
      summaryEl.textContent = `${state.filtered.length} / ${state.files.length} 件`;
      const previousScrollTop = fileListEl.scrollTop;
      if (!state.filtered.length) {
        fileListEl.innerHTML = '<p class="empty" style="padding:12px;">該当する作問結果がありません。</p>';
        return;
      }

      fileListEl.innerHTML = '';
      for (const file of state.filtered) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.fileName = file.name;
        button.className = `file-button${file.name === state.selectedName ? ' active' : ''}`;
        button.innerHTML = `
          <span class="file-name">${escapeForHtml(file.label || file.name)}</span>
          <span class="file-meta">
            <span>${escapeForHtml(file.gradeLabel || '')}</span>
            <span>${escapeForHtml(file.areaLabel || '')}</span>
            <span>${escapeForHtml(file.unit || file.learningItemKey || '')}</span>
            <span>${escapeForHtml(file.item || '')}</span>
            <span>${formatDate(file.updatedAt)}</span>
            <span>${Math.max(1, Math.ceil((file.size || 0) / 1024))}KB</span>
          </span>
        `;
        button.addEventListener('click', () => loadQuestion(file.name));
        fileListEl.appendChild(button);
      }
      fileListEl.scrollTop = previousScrollTop;
    }

    function updateActiveFileButton() {
      for (const button of fileListEl.querySelectorAll('.file-button')) {
        button.classList.toggle('active', button.dataset.fileName === state.selectedName);
      }
    }

    function setEditMode(editing) {
      state.editing = editing;
      editFileBtn.hidden = editing;
      saveEditBtn.hidden = !editing;
      cancelEditBtn.hidden = !editing;
      copyNameBtn.disabled = editing || !state.selectedName;
      renameFileBtn.disabled = editing || !state.selectedName;
      deleteFileBtn.disabled = editing || !state.selectedName;
    }

    function showRawEditor() {
      if (!state.selectedName) return;
      setEditMode(true);
      outputEl.innerHTML = '';
      const textarea = document.createElement('textarea');
      textarea.id = 'raw-editor';
      textarea.spellcheck = false;
      textarea.value = state.selectedContent || '';
      outputEl.appendChild(textarea);
      textarea.focus();
      statusEl.className = '';
      statusEl.textContent = `${state.selectedName} を編集中`;
    }

    async function cancelEdit() {
      if (!state.editing) return;
      setEditMode(false);
      await renderContent(state.selectedContent || '');
      statusEl.className = '';
      statusEl.textContent = `${state.selectedName} を表示中`;
    }

    async function saveEditedQuestion() {
      if (!state.editing || !state.selectedName) return;
      const textarea = document.getElementById('raw-editor');
      const content = textarea?.value ?? '';

      saveEditBtn.disabled = true;
      cancelEditBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = '保存中...';

      try {
        const data = await fetchJson(`/question-files/${encodeURIComponent(state.selectedName)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        state.selectedContent = content;
        const current = state.files.find(file => file.name === state.selectedName);
        if (current) {
          current.updatedAt = data.updatedAt || current.updatedAt;
          current.size = data.size ?? current.size;
        }
        setEditMode(false);
        saveEditBtn.disabled = false;
        cancelEditBtn.disabled = false;
        applyFilters();
        await renderContent(content);
        statusEl.textContent = `${state.selectedName} を保存しました`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message;
        statusEl.className = 'error';
        saveEditBtn.disabled = false;
        cancelEditBtn.disabled = false;
      }
    }

    function selectedFileIndex() {
      return state.filtered.findIndex(file => file.name === state.selectedName);
    }

    function focusSelectedFile() {
      const selectedButton = fileListEl.querySelector('.file-button.active');
      if (!selectedButton) return;
      selectedButton.focus({ preventScroll: true });
      selectedButton.scrollIntoView({ block: 'nearest' });
    }

    async function moveSelection(delta) {
      if (!state.filtered.length) return;

      const currentIndex = selectedFileIndex();
      const fallbackIndex = delta > 0 ? -1 : state.filtered.length;
      const nextIndex = Math.min(
        state.filtered.length - 1,
        Math.max(0, (currentIndex === -1 ? fallbackIndex : currentIndex) + delta)
      );
      const nextFile = state.filtered[nextIndex];
      if (!nextFile || nextFile.name === state.selectedName) {
        focusSelectedFile();
        return;
      }

      const token = ++keyboardNavigationToken;
      await loadQuestion(nextFile.name);
      if (token === keyboardNavigationToken) focusSelectedFile();
    }

    function isTypingTarget(target) {
      return ['INPUT', 'TEXTAREA', 'SELECT'].includes(target?.tagName || '') || target?.isContentEditable;
    }

    function handleKeyboardNavigation(event) {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
      if (isTypingTarget(event.target)) return;

      if (event.key.toLowerCase() === 'r') {
        event.preventDefault();
        loadFiles();
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveSelection(1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveSelection(-1);
      }
    }

    async function loadFiles() {
      statusEl.textContent = '一覧を読み込み中...';
      try {
        const [data, promptData] = await Promise.all([
          fetchJson('/question-files?all=1'),
          fetchJson('/prompt-files')
        ]);
        const promptMetaByStem = buildPromptMetaByStem(Array.isArray(promptData.files) ? promptData.files : []);
        state.files = (Array.isArray(data.files) ? data.files : []).map(file => {
          const grade = gradeFromQuestionFileName(file.name);
          const promptStem = promptStemFromQuestionFileName(file.name);
          const promptMeta = promptMetaByStem.get(promptStem) || {};
          return {
            ...file,
            promptStem,
            grade,
            gradeLabel: grade ? `中${grade}` : '学年未設定',
            code: promptMeta.code || '',
            areaCode: promptMeta.areaCode || '',
            areaLabel: promptMeta.areaLabel || '',
            unitCode: promptMeta.unitCode || '',
            itemCode: promptMeta.itemCode || '',
            unit: promptMeta.unit || '',
            item: promptMeta.item || ''
          };
        });
        populateFilterOptions();
        applyFilters();
        statusEl.textContent = `保存先: ${data.directory || ''}`;
        if (!state.selectedName && state.files[0]) {
          await loadQuestion(state.files[0].name);
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message;
        statusEl.className = 'error';
      }
    }

    async function loadQuestion(name) {
      if (!name) return;
      if (state.editing) {
        const discard = window.confirm('編集中の内容を破棄して別のファイルを読み込みますか？');
        if (!discard) return;
      }
      state.selectedName = name;
      state.selectedContent = '';
      setEditMode(false);
      updateActiveFileButton();
      titleEl.textContent = name;
      editFileBtn.disabled = false;
      copyNameBtn.disabled = false;
      renameFileBtn.disabled = false;
      deleteFileBtn.disabled = false;
      statusEl.className = '';
      statusEl.textContent = '読み込み中...';
      outputEl.innerHTML = '<p class="empty">レンダリング中...</p>';

      try {
        const data = await fetchJson(`/question-files/${encodeURIComponent(name)}`);
        state.selectedContent = data.content || '';
        await renderContent(state.selectedContent);
        statusEl.textContent = `${name} を表示中`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message;
        statusEl.className = 'error';
        outputEl.innerHTML = `<p style="color:red">${escapeForHtml(err.message)}</p>`;
      }
    }

    function normalizeQuestionFileName(name) {
      const trimmed = String(name || '').trim();
      if (!trimmed) return '';
      return /\.txt$/i.test(trimmed) ? trimmed : `${trimmed}.txt`;
    }

    async function renameSelectedQuestion() {
      const name = state.selectedName;
      if (!name) return;

      const input = window.prompt('新しいファイル名を入力してください。', name);
      if (input === null) return;

      const newName = normalizeQuestionFileName(input);
      if (!newName || newName === name) return;

      renameFileBtn.disabled = true;
      deleteFileBtn.disabled = true;
      copyNameBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'リネーム中...';

      try {
        const data = await fetchJson(`/question-files/${encodeURIComponent(name)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newName })
        });
        const renamedName = data.newName || newName;
        const current = state.files.find(file => file.name === name);
        if (current) {
          current.name = renamedName;
          current.label = renamedName.replace(/\.txt$/i, '');
          current.sourceStem = sourceStemFromQuestionFileName(renamedName);
          current.learningItemKey = learningItemKeyFromQuestionFileName(renamedName);
          current.promptStem = promptStemFromQuestionFileName(renamedName);
          current.grade = gradeFromQuestionFileName(renamedName);
          current.gradeLabel = current.grade ? `中${current.grade}` : '学年未設定';
        }
        state.selectedName = renamedName;
        state.files.sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
        populateFilterOptions();
        applyFilters();
        await loadQuestion(renamedName);
        statusEl.textContent = `${name} を ${renamedName} に変更しました`;
        focusSelectedFile();
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message;
        statusEl.className = 'error';
        copyNameBtn.disabled = false;
        renameFileBtn.disabled = false;
        deleteFileBtn.disabled = false;
      }
    }

    async function deleteSelectedQuestion() {
      const name = state.selectedName;
      if (!name) return;

      const confirmed = window.confirm(`${name}\n\nこの作問結果を削除します。元に戻せません。`);
      if (!confirmed) return;

      deleteFileBtn.disabled = true;
      copyNameBtn.disabled = true;
      renameFileBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = '削除中...';

      try {
        const currentFilteredIndex = state.filtered.findIndex(file => file.name === name);
        await fetchJson(`/question-files/${encodeURIComponent(name)}`, { method: 'DELETE' });
        state.files = state.files.filter(file => file.name !== name);
        state.selectedName = '';
        state.selectedContent = '';
        setEditMode(false);
        titleEl.textContent = '未選択';
        outputEl.innerHTML = '<p class="empty">削除しました。左の一覧から作問結果を選択してください。</p>';
        populateFilterOptions();
        applyFilters();

        const nextFile = state.filtered[Math.min(Math.max(currentFilteredIndex, 0), state.filtered.length - 1)];
        if (nextFile) {
          await loadQuestion(nextFile.name);
          statusEl.textContent = `${name} を削除しました`;
        } else {
          editFileBtn.disabled = true;
          copyNameBtn.disabled = true;
          renameFileBtn.disabled = true;
          deleteFileBtn.disabled = true;
          statusEl.textContent = `${name} を削除しました`;
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message;
        statusEl.className = 'error';
        copyNameBtn.disabled = false;
        renameFileBtn.disabled = false;
        deleteFileBtn.disabled = false;
      }
    }

    async function exportVisibleQuestionsToWord() {
      if (wordExportRunning) return;

      const targets = state.filtered.slice();
      if (!targets.length) {
        setHeaderExportStatus('表示中の問題がありません', 'error');
        return;
      }

      if (!window.confirm(`左欄に表示されている ${targets.length} 件をWordファイルへ書き出し、ZIPでダウンロードします。よろしいですか？`)) {
        return;
      }

      wordExportRunning = true;
      exportVisibleWordBtn.disabled = true;
      setHeaderExportStatus('Word出力エンジンを準備中...');

      let savedCount = 0;

      try {
        const wordWin = await ensureWordExportFrame();
        const zipEntries = [];
        for (let i = 0; i < targets.length; i++) {
          const file = targets[i];
          setHeaderExportStatus(`${i + 1}/${targets.length} Word作成中: ${file.name}`);

          const data = await fetchJson(`/question-files/${encodeURIComponent(file.name)}`);
          const blob = await wordWin.questionWordExport.buildDocxBlob({
            number: i + 1,
            label: [file.areaLabel, file.unit, file.item].filter(Boolean).join('｜') || file.label || file.name,
            fileName: file.name,
            content: data.content || ''
          });
          const outName = file.name.replace(/\.txt$/i, '.docx');
          zipEntries.push({ name: outName, blob });
          savedCount++;
        }

        setHeaderExportStatus('ZIPを作成中...');
        const zipBlob = await createZipBlob(zipEntries);
        const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);
        downloadBlob(`question-browser-word-${targets.length}files-${stamp}.zip`, 'application/zip', zipBlob);
        setHeaderExportStatus(`${savedCount}/${targets.length} 件のWordをZIPで出力しました`, 'ok');
      } catch (err) {
        console.error(err);
        if (err?.name === 'AbortError') {
          setHeaderExportStatus('Word出力をキャンセルしました');
        } else {
          setHeaderExportStatus(`${savedCount}/${targets.length} 件まで出力: ${err.message}`, 'error');
        }
      } finally {
        wordExportRunning = false;
        exportVisibleWordBtn.disabled = false;
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadFiles);
    searchInput.addEventListener('input', applyFilters);
    function handleFilterScopeChange() {
      populateFilterOptions();
      applyFilters();
    }
    gradeFilter.addEventListener('change', handleFilterScopeChange);
    areaFilter.addEventListener('change', handleFilterScopeChange);
    unitFilter.addEventListener('change', handleFilterScopeChange);
    itemFilter.addEventListener('change', applyFilters);
    exportVisibleWordBtn.addEventListener('click', exportVisibleQuestionsToWord);
    editFileBtn.addEventListener('click', showRawEditor);
    saveEditBtn.addEventListener('click', saveEditedQuestion);
    cancelEditBtn.addEventListener('click', cancelEdit);
    copyNameBtn.addEventListener('click', async () => {
      if (!state.selectedName) return;
      await navigator.clipboard.writeText(state.selectedName);
      statusEl.textContent = 'ファイル名をコピーしました';
    });
    renameFileBtn.addEventListener('click', renameSelectedQuestion);
    deleteFileBtn.addEventListener('click', deleteSelectedQuestion);
    document.addEventListener('keydown', handleKeyboardNavigation);

    window.addEventListener('DOMContentLoaded', () => {
      initLargeOutputToggle();
      loadFiles();
    });
  </script>
</body>
</html>
