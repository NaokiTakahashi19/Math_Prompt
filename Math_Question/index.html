<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Question</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fb;
      --panel: #ffffff;
      --text: #1d2733;
      --muted: #657385;
      --line: #d8e0ea;
      --accent: #0969da;
      --accent-soft: #e7f0ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .count {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      padding: 24px 0;
    }

    .item {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel);
      text-decoration: none;
    }

    .item:hover,
    .item:focus {
      border-color: #8bb8ff;
      background: var(--accent-soft);
      outline: none;
    }

    .name {
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .ext {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      background: var(--panel);
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Math Question</h1>
      <p>公開されている問題の一覧です。ファイル名で検索し、クリックするとビューアで表示できます。</p>
      <div class="toolbar">
        <input id="search" type="search" autocomplete="off" placeholder="例: m-jh1-A-01-01b">
        <div id="count" class="count">読み込み中...</div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="message" class="message">ファイル一覧を読み込んでいます。</div>
    <div id="list" class="list" hidden></div>
  </main>

  <script>
    const apiUrl = "https://api.github.com/repos/NaokiTakahashi19/Math_Prompt/contents/Math_Question?ref=main";
    const list = document.getElementById("list");
    const message = document.getElementById("message");
    const search = document.getElementById("search");
    const count = document.getElementById("count");
    let files = [];

    function render() {
      const query = search.value.trim().toLowerCase();
      const visibleFiles = files.filter((file) => file.name.toLowerCase().includes(query));

      list.innerHTML = "";
      for (const file of visibleFiles) {
        const item = document.createElement("a");
        item.className = "item";
        const questionUrl = new URL(`./${encodeURIComponent(file.name)}`, window.location.href);
        const viewerUrl = new URL('../question-viewer/', window.location.href);
        viewerUrl.searchParams.set('url', questionUrl.href);
        item.href = viewerUrl.href;
        item.target = "_blank";
        item.rel = "noopener";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = file.name;

        const ext = document.createElement("span");
        ext.className = "ext";
        ext.textContent = "txt";

        item.append(name, ext);
        list.append(item);
      }

      count.textContent = `${visibleFiles.length} / ${files.length} 件`;
      message.hidden = visibleFiles.length > 0;
      list.hidden = visibleFiles.length === 0;
      if (visibleFiles.length === 0) {
        message.textContent = query ? "一致するファイルがありません。" : "表示できるファイルがありません。";
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status}`);
        }

        files = (await response.json())
          .filter((file) => file.type === "file" && file.name.endsWith(".txt"))
          .sort((a, b) => a.name.localeCompare(b.name, "en"));

        render();
      } catch (error) {
        count.textContent = "読み込み失敗";
        message.hidden = false;
        list.hidden = true;
        message.textContent = "ファイル一覧を読み込めませんでした。時間をおいて再読み込みしてください。";
        console.error(error);
      }
    }

    search.addEventListener("input", render);
    loadFiles();
  </script>
</body>
</html>
