<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2733;
      background: #f7f9fb;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    a {
      color: #0969da;
    }
  </style>
</head>
<body>
  <main>
    <h1>ページが見つかりません</h1>
    <p>指定されたページは見つかりませんでした。</p>
    <p><a href="/Math_Prompt/Math_Question/">Math_Question の一覧へ移動する</a></p>
  </main>
  <script>
    const basePath = "/Math_Prompt";
    const path = window.location.pathname;
    const treePrefix = `${basePath}/tree/main`;

    if (path === `${basePath}/tree/main` || path === `${basePath}/tree/main/`) {
      window.location.replace(`${basePath}/`);
    } else if (path.startsWith(`${treePrefix}/`)) {
      window.location.replace(`${basePath}${path.slice(treePrefix.length)}${window.location.search}${window.location.hash}`);
    }
  </script>
</body>
</html>
